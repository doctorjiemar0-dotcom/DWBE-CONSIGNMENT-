/* Compact mobile navigation and product gallery */
.quicknav{position:sticky;top:0;z-index:20;background:#f4f7f5ee;backdrop-filter:blur(8px);display:flex;gap:7px;overflow-x:auto;padding:9px 0;margin-bottom:12px}

.gallery-controls button{border:0;background:var(--g);color:white;border-radius:10px;padding:10px 16px;font-size:1.1rem;font-weight:800;cursor:pointer}
.gallery-controls span{font-weight:800}
.gallery-error{font-size:.8rem;color:#b71c1c;display:none}
.section-anchor{scroll-margin-top:75px}

.quicknav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;background:#e8f5e9;padding:12px;border:2px solid #bad5c2;border-radius:16px;box-shadow:0 5px 18px #12331f20}

.quicknav button:nth-child(2){background:#a65b00;box-shadow:0 4px 0 #693900,0 6px 10px #0002}
.quicknav button:nth-child(3){background:#1661a8;box-shadow:0 4px 0 #0b3967,0 6px 10px #0002}
.quicknav button:nth-child(4){background:#6a258e;box-shadow:0 4px 0 #3e1458,0 6px 10px #0002}
.quicknav button:active,.gallery-controls button:active,.go:active{transform:translateY(2px);filter:brightness(1.1)}
.fold>summary{background:#e8f5e9;border-left:6px solid #2e7d32;font-size:1.05rem}
.fold>summary::after{background:#185c38;color:white;border-radius:50%;width:33px;height:33px;display:grid;place-items:center;font-size:1.25rem;flex-shrink:0}
.gallery-controls button{background:#a65b00;min-width:62px;min-height:48px;box-shadow:0 3px 0 #693900}
.go:not(:disabled){box-shadow:0 4px 0 #17521b,0 7px 14px #0002}
.go:focus-visible,.quicknav button:focus-visible,.gallery-controls button:focus-visible,.fold summary:focus-visible{outline:4px solid #f2b632;outline-offset:3px}
@media(max-width:360px){.quicknav button{font-size:.92rem;padding:10px 5px}}

/* PRIORITY + RESERVATION CALENDAR */
.chip{font:inherit;color:var(--ink);text-align:left;cursor:pointer;flex:1;min-width:130px}
.chip small{display:block;color:#678;font-weight:600}
.cal{background:#f3faf4;border:1px solid #d7e6da;border-radius:14px;padding:10px}

.dow{text-align:center;font-size:.72rem;font-weight:800;color:#678;padding:4px 0}

.cd.prep,.cd.out,.cd.cap{background:#eceff1;color:#90a4ae;border-color:#eceff1;cursor:not-allowed}

.cd.full small{color:#b71c1c}
.cd.on{background:var(--g2);color:#fff;border-color:var(--g)}
.cd.on small{color:#fff}
.cd.blank{visibility:hidden}
.quicknav button:nth-child(5){grid-column:1/-1;background:#00695c;box-shadow:0 4px 0 #00352d,0 6px 10px #0002}
.oc{border:1px solid #d7e6da;border-left-width:6px;border-radius:12px;padding:12px;margin:10px 0;background:#fff;font-size:.9rem;line-height:1.5}
.sb{display:inline-block;padding:3px 9px;border-radius:999px;color:#fff;font-weight:800;font-size:.75rem}

const calc=()=>{let pcs=0,subtotal=0;for(const s of products){pcs+=cart[s];subtotal+=cart[s]*Number(prices[s])}subtotal=Math.round(subtotal*100)/100;const discount=pcs>=minOrder?Math.round(subtotal*rate*100)/100:0;const base=Math.round((subtotal-discount)*100)/100;const rush=priority==='Urgent'?pcs*RUSH_FEE:0;const requested=Math.floor(Number(document.getElementById('redeem')?.value||0));const coinsUsed=pcs>=7?Math.max(0,Math.min(20,walletCoins,Number.isFinite(requested)?requested:0,Math.floor(base))):0;return{pcs,subtotal,discount,rush,coinsUsed,total:Math.round((base+rush-coinsUsed)*100)/100}};

function qrRender(){const styles=qr.styles||[],cur=styles.find(s=>s.styleType===style),max=Math.max(1,Math.min(qr.maxQty||10,cur?cur.stock:10));qty=Math.min(qty,max);set(`<div class="card"><h2>DISTRIBUTOR: ${esc(qr.maskedName)}</h2><div class="promo">🎟️ ${peso(qr.discountPerPc)} OFF bawat walis tambo</div><h3>Piliin ang binili mo</h3><div class="chips">${styles.map(s=>`<button class="chip ${s.styleType===style?'on':''}" data-style="${esc(s.styleType)}">${esc(s.styleType)} (${esc(s.stock)} pcs)</button>`).join('')}</div><h3>Ilang piraso?</h3><div class="qty"><button id="minus">−</button><strong>${qty}</strong><button id="plus">+</button></div><p class="good">Diskwento: ${peso(qty*qr.discountPerPc)}</p><button class="go" id="qrSubmit" ${style?'':'disabled'}>✅ Kumpirmahin ang Pagbili</button></div>`);root.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{style=b.dataset.style;qrRender()});document.getElementById('minus').onclick=()=>{qty=Math.max(1,qty-1);qrRender()};document.getElementById('plus').onclick=()=>{qty=Math.min(max,qty+1);qrRender()};document.getElementById('qrSubmit').onclick=qrSubmit}
