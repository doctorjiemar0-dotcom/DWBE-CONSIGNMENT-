const calc=()=>{let pcs=0,subtotal=0;for(const st of styles){pcs+=cart[st];subtotal+=cart[st]*Number(prices[st])}subtotal=Math.round(subtotal*100)/100;const bulk=pcs>=7?pcs*5:0,discount=Math.min(subtotal,bulk),rush=priority==='Urgent'?pcs*20:0,raw=Math.floor(Number(document.getElementById('redeem').value)||0),coins=Math.max(0,Math.min(20,wallet,raw,Math.floor(subtotal-discount)));return{pcs,subtotal,discount,bulk,rush,coins,total:Math.round((subtotal-discount+rush-coins)*100)/100}};window.refresh=refresh;function refresh(){const x=calc(),min=minQty();for(const s of styles)document.getElementById('qty_'+s).textContent=cart[s];for(const [id,value]of Object.entries({pcs:x.pcs+' pcs',subtotal:peso(x.subtotal),discount:'−'+peso(x.bulk),rush:'+'+peso(x.rush),total:peso(x.total),earn:Math.floor(x.pcs/7)*2}))document.getElementById(id).textContent=value;document.getElementById('minmsg').textContent=area?(area==='OSIAO'?'OSIAO: minimum 1 pc.':'Labas ng OSIAO: minimum 7 pcs.'):'Ilagay ang bayan / lungsod at probinsya para malaman ang minimum order.';document.getElementById('publicLocality').className=area==='OSIAO'?'area-osiao':area?'area-other':'';document.getElementById('minmsg').className='small '+(area==='OSIAO'?'m-osiao':area?'m-other':'muted');document.getElementById('send').disabled=!area||x.pcs<min;document.querySelectorAll('[data-style]').forEach(b=>b.disabled=Number(b.dataset.n)>0?cart[b.dataset.style]>=50:cart[b.dataset.style]<=0)}document.getElementById('publicLocality').oninput=e=>{const t=e.target.value.trim(),a=document.getElementById('address');const parts=t.toLowerCase().split(',').map(v=>v.trim()).filter(Boolean);const osiao=parts.some(v=>v==='osiao') || /^osiao(?:\s*,|$)/i.test(t);area=osiao?'OSIAO':t?'OTHER':'';const Z=['IRAYA 1','IRAYA 2','BACOLOD','CABANG AN','CENTRO IBABA','BARIO SITE','GAJO','TIRIS'];const z=Z.find(n=>parts.some(v=>v===n.toLowerCase()));const auto=osiao?(z?z+', ':'')+'OSIAO, BACON DISTRICT, SORSOGON CITY':'';if(!a.value.trim()||a.value function openRating(id){const o=orders.find(x=>x.id===id);if(!o||o.status!=='Completed'||reviews.some(r=>r.orderId===id))return alert('Hindi eligible o na-rate na ang order na ito.');const styles=[...new Set((o.items||[]).filter(i=>Number(i.qty)>0).map(i=>i.style))];const modal=document.createElement('div');modal.className='rate-overlay';modal.innerHTML=`<div class="rate-modal"><h2>⭐ Rate ang Iyong Walis</h2><p class="muted">Order ${esc(code(id))} · +1 coin sa buong order kahit ilang produkto ang i-rate. Kahit mababang rating, may reward.</p>${styles.map(st=>`<label class="rate-label">🧹 ${esc(st)}<select data-stars="${esc(st)}">${[5,4,3,2,1].map(n=>`<option value="${n}">${'★'.repeat(n)} (${n}/5)</option>`).join('')}</select></label>`).join('')}<label class="rate-label" style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="maskReviewer" style="width:auto" checked> 🔒 Itago ang pangalan ko sa public reviews (asterisks)</label><label class="rate-label">Review (optional)<textarea id="ratingComment" maxlength="300" rows="3" placeholder="Ano ang masasabi mo sa produkto?"></textarea></label><div id="ratingError" class="error hidden"></div><button id="ratingSubmit" class="go">⭐ I-submit ang Rating (+1 Coin)</button><button id="ratingClose" class="go" style="background:#607d8b">Kanselahin</button></div>`;document.body.appendChild(modal);modal.querySelector('#ratingClose').onclick=()=>modal.remove();modal.onclick=e=>{if(e.target===modal)modal.remove()};modal.querySelector('#ratingSubmit').onclick=async()=>{const btn=modal.querySelector('#ratingSubmit'),err=modal.querySelector('#ratingError');btn.disabled=true;const ratings=[...modal.querySelectorAll('[data-stars]')].map(x=>({style:x.dataset.stars,stars:Number(x.value)})),comment=modal.querySelector('#ratingComment').value.trim(),hideName=modal.querySelector('#maskReviewer').checked,rref=doc(db,TEST?'buyer_reviews_test':'buyer_reviews',id),oref=doc(db,OC,id),wref=doc(db,WC,user.uid);try{await runTransaction async function qrStart(){try{const ref=doc(db,QC,TOKEN),s=await getDoc(ref);if(!s.exists())return msg('Hindi nahanap ang QR.',true);const q=s.data();if(q.status!=='open')return msg('Nagamit na ang QR.');if(q.expiresAt&&Date.now()>q.expiresAt)return msg('Expired na ang QR.',true);let style=q.styles?.[0]?.styleType||'Ordinary',qty=1;function render(){const cur=q.styles?.find(x=>x.styleType===style),max=Math.max(1,Math.min(50,q.maxQty||10,cur?.stock||10));qty=Math.min(qty,max);root.innerHTML=`<div class="card"><h2>DISTRIBUTOR: ${esc(q.maskedName)}</h2><p>🎟️ ${peso(q.discountPerPc)} OFF bawat walis tambo</p>${(q.styles||[]).map(x=>`<button class="link" data-style="${esc(x.styleType)}">${esc(x.styleType)} (${x.stock} pcs)</button>`).join('')}<p>${esc(style)} × ${qty}</p><button class="link" id="minus">−</button><button class="link" id="plus">＋</button><p>Discount: ${peso(qty*q.discountPerPc)}</p><button class="go" id="confirm">Kumpirmahin</button></div>`;root.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;render()});document.getElementById('minus').onclick=()=>{qty=Math.max(1,qty-1);render()};document.getElementById('plus').onclick=()=>{qty=Math.min(max,qty+1);render()};document.getElementById('confirm').onclick=async()=>{try{await updateDoc(ref,{status:'scanned',style,qty,scannedAt:Date.now()});msg('⏳ Hinihintay ang kumpirmasyon ng distributor...');unsubs.push(onSnapshot(ref,ss=>{const d=ss.data()||{};if(d.status==='recorded')msg('✅ Naitala na! Code: '+TOKEN.slice(-4).toUpperCase()+' · Discount: '+peso(d.discount));if(d.status==='rejected')msg('Hindi naitala ang QR.',true)}))}catch(e){msg('QR error: '+(e.code||e.message),true)}}}render()}catch(e){msg('Hindi ma-load ang QR: '+(e.code||e.message),true)}}if(TOKEN)qrStart();
