<!doctype html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DWBE Buyer</title><style>
:root{--g:#185c38;--green:#2e7d32}*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#12331f;font:16px system-ui,Arial}header{background:var(--g);color:#fff;padding:17px;font-weight:800}main{max-width:540px;margin:auto;padding:14px}.card{background:white;border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 3px 12px #0001}h2{margin:0 0 12px;color:var(--g)}.hero{background:linear-gradient(120deg,#185c38,#2e7d32);color:white}.hero h2{color:white}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:9px 0}.product{padding:12px;border:2px solid #e0e9e3;border-radius:12px;margin:10px 0}.product img{width:100%;max-height:190px;object-fit:contain;border-radius:9px}.step{display:flex;gap:10px;align-items:center}button{cursor:pointer;font:inherit}.step button{background:#185c38;color:white;border:0;border-radius:50%;width:42px;height:42px;font-size:25px;font-weight:bold}.step strong{min-width:24px;text-align:center}.go,.tab{border:0;border-radius:12px;padding:13px;background:var(--green);color:white;font-weight:800}.go{width:100%;margin-top:12px}.go:disabled,button:disabled{opacity:.45;cursor:not-allowed}.tab{margin:3px;background:#185c38}.tab.active{background:#f9a825;color:#231900;outline:2px solid #185c38}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #bccdc2;border-radius:9px;font:inherit}.total{background:#e8f5e9;padding:13px;border-radius:12px}.promo{background:#fff8e1;border:1px solid #e9b93e;padding:12px;border-radius:12px;margin:9px 0}.error{background:#ffebee;color:#b71c1c;padding:10px;border-radius:10px}.good{color:#2e7d32;font-weight:800}.muted{font-size:.85rem;color:#567}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.days button{border:1px solid #98c69f;border-radius:9px;background:#e8f5e9;padding:9px 2px;font-size:.8rem}.days button.active{background:#185c38;color:white}.days button:disabled{background:#eee;border-color:#ddd;color:#888}.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.slots button{padding:12px;border:2px solid #86b58b;border-radius:10px;background:#eff9ef}.slots button.active{background:#185c38;color:#fff}.slots button:disabled{background:#eee;border-color:#ddd}.hide{display:none}.hp{position:absolute;left:-9999px}.code{text-align:center;font-size:2rem;font-weight:900;letter-spacing:4px}a{color:#185c38}details summary{font-weight:800;color:#185c38;cursor:pointer;padding:7px 0}
</style></head><body><header>🧹 Doctor's Whisk Broom · Buyer</header><main id="app"><div class="card">Binubuksan...</div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import{getFirestore,doc,getDoc,collection,runTransaction,onSnapshot,updateDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us',authDomain:'dwbe-consignment.firebaseapp.com',projectId:'dwbe-consignment',storageBucket:'dwbe-consignment.firebasestorage.app',messagingSenderId:'205759197252',appId:'1:205759197252:web:b04400821f81791d10cc11'},'buyer');
const db=getFirestore(app),auth=getAuth(app),root=document.getElementById('app'),qp=new URLSearchParams(location.search),token=(qp.get('q')||'').trim(),test=qp.get('test')==='1',orders=test?'buyer_orders_test':'buyer_orders',slots=test?'buyer_slots_test':'buyer_slots',qrCol=test?'buyer_qr_test':'buyer_qr',publicDoc=test?'directory_test':'directory',walletCol=test?'buyer_wallets_test':'buyer_wallets',lastKey='dwbe_last_order'+(test?'_test':'');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>'₱'+Number(x||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),show=x=>root.innerHTML=x,round=x=>Math.round(x*100)/100,day=x=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+x);return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
let user=null,pub=null,coins=0,cart={Ordinary:0,Premium:0},priority='Minor',date='',slot=0,walletUnsub=null,orderUnsub=null,qr=null,qrStyle='',qrQty=1,loadVersion=0;
function error(msg){let e=document.getElementById('error');if(e){e.textContent=msg;e.classList.remove('hide')}else show(`<div class="card error">${esc(msg)}</div>`)}
function authPage(){show(`<div class="card"><h2>🪙 DWBE Rewards Login</h2><p>Mag-login o gumawa ng account para makita ang coins sa anumang cellphone.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="pass" type="password" minlength="6" required autocomplete="current-password"></div><div id="error" class="error hide"></div><button class="go" id="login" type="submit">Mag-login</button><button class="go" id="register" type="button">Gumawa ng account</button></form></div>`);let busy=false;async function submit(reg){if(busy)return;let e=document.getElementById('email'),p=document.getElementById('pass');if(!e.reportValidity()||!p.reportValidity())return;busy=true;document.getElementById('login').disabled=document.getElementById('register').disabled=true;try{if(reg)await createUserWithEmailAndPassword(auth,e.value.trim(),p.value);else await signInWithEmailAndPassword(auth,e.value.trim(),p.value)}catch(ex){error('Hindi nagtagumpay: '+(ex.code||ex.message));busy=false;document.getElementById('login').disabled=document.getElementById('register').disabled=false}}document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();submit(false)};document.getElementById('register').onclick=()=>submit(true)}
onAuthStateChanged(auth,u=>{if(token)return;user=u;if(walletUnsub){walletUnsub();walletUnsub=null}if(orderUnsub){orderUnsub();orderUnsub=null}if(!u){authPage();return}coins=0;walletUnsub=onSnapshot(doc(db,walletCol,u.uid),s=>{coins=Math.max(0,Number(s.data()?.balance||0));const x=document.getElementById('balance');if(x)x.textContent=coins;const r=document.getElementById('redeem');if(r){r.max=Math.min(20,coins);if(Number(r.value)>coins)r.value=coins;r.dispatchEvent(new Event('input'))}},e=>console.warn(e));initStore()});
async function initStore(){const v=++loadVersion;show('<div class="card">Binubuksan ang tindahan...</div>');try{const s=await getDoc(doc(db,'buyer_public',publicDoc));if(v!==loadVersion)return;pub=s.data()||{};cart={Ordinary:0,Premium:0};priority='Minor';date='';slot=0;renderStore()}catch(e){error('Hindi ma-load ang tindahan: '+(e.code||e.message))}}
function calc(){const p=pub?.prices||{},pcs=cart.Ordinary+cart.Premium,subtotal=round(cart.Ordinary*Number(p.Ordinary||0)+cart.Premium*Number(p.Premium||0)),discount=pcs>=7?round(subtotal*.05):0,urgent=priority==='Urgent'?pcs*20:0,base=round(subtotal-discount+urgent),requested=Math.floor(Number(document.getElementById('redeem')?.value||0)),used=pcs>=7?Math.max(0,Math.min(20,coins,Number.isFinite(requested)?requested:0,Math.floor(base))):0;return{pcs,subtotal,discount,urgent,used,total:round(base-used),earn:Math.floor(pcs/7)*2}}
function renderStore(){let prices=pub?.prices||{},products=['Ordinary','Premium'].filter(p=>Number(prices[p])>0),promos=Array.isArray(pub?.promos)?pub.promos.filter(p=>!p.until||p.until>=day(0)):[],dist=Array.isArray(pub?.distributors)?pub.distributors:[];let last;try{last=JSON.parse(localStorage.getItem(lastKey)||'null')}catch{};show(`<div class="card"><h2>🪙 DWBE Wallet</h2><div>${esc(user.email)} · <b><span id="balance">${coins}</span> coins</b></div><div class="muted">1 coin = ₱1 · 2 coins kada 7 pcs kapag Completed.</div><button class="tab" id="logout">Mag-logout</button></div><div class="card hero"><h2>🧹 Bumili nang Direkta</h2><p>Doctor's Whisk Broom etc. · Sorsogon</p></div>${last?.id?`<div class="card"><h2>📦 Huling order mo</h2><div class="row"><b>${esc(last.id.slice(0,6).toUpperCase())}</b><b>${money(last.total)}</b></div><div id="lastStatus">Kinukuha ang status...</div></div>`:''}${promos.length?`<details class="card"><summary>🎁 Mga Promo (${promos.length})</summary>${promos.map(p=>`<div class="promo"><b>${esc(p.title)}</b><p>${esc(p.text)}</p></div>`).join('')}</details>`:''}<div class="card"><h2>🛒 Mag-order</h2><div class="promo"><b>5% OFF · Minimum 7 pcs</b><div>Urgent: dagdag ₱20 bawat piraso; walang 5% discount sa urgent charge.</div></div>${products.map(p=>`<div class="product"><details><summary>${esc(p)} · ${money(prices[p])}/pc · Tingnan ang larawan</summary><img loading="lazy" alt="${esc(p)} walis tambo" src="https://raw.githubusercontent.com/doctorjiemaro-dotcom/DWBE-AGREEMENTS/main/${p}.jpg" onerror="this.style.display='none'"></details><div class="row"><b>${esc(p)}</b><div class="step"><button data-p="${p}" data-d="-1">−</button><strong id="q_${p}">0</strong><button data-p="${p}" data-d="1">+</button></div></div></div>`).join('')}${products.length?`<h3>Priority</h3><button class="tab active" id="minor">🟢 Minor · Regular</button><button class="tab" id="urgent">🔴 URGENT · +₱20/pc</button><div class="total"><div class="row"><span>Bilang</span><b id="pcs">0</b></div><div class="row"><span>Regular</span><b id="subtotal">₱0</b></div><div class="row good"><span>5% OFF</span><b id="discount">₱0</b></div><div class="row"><span>Urgent charge</span><b id="urgentFee">₱0</b></div><div class="row"><label for="redeem">Coins (max 20)</label><input id="redeem" type="number" min="0" max="20" value="0" style="width:75px"></div><div class="row good"><span>Coins discount</span><b id="coinsOff">₱0</b></div><hr><div class="row"><b>Babayaran</b><b id="total">₱0</b></div><div class="muted" id="earn">0 coins kapag Completed</div></div><details class="card" open><summary>📅 Piliin ang pickup date (5 araw na allowance)</summary><p class="muted">Kasama ang weekend. Hanggang 4 reservations bawat pickup date. Walang oras na kailangang piliin.</p><div class="days" id="days"></div><p id="dateLabel"></p><div class="slots" id="slots"></div></details><div id="error" class="error hide"></div>${[['name','Pangalan','text'],['phone','Telepono / GCash','tel'],['email','Email','email'],['address','Pickup/Delivery address','textarea'],['note','Tala (opsyonal)','textarea']].map(([id,label,type])=>`<div class="field"><label>${label}</label>${type==='textarea'?`<textarea id="f_${id}" rows="2" maxlength="200"></textarea>`:`<input id="f_${id}" type="${type}" maxlength="100" ${id==='email'?`value="${esc(user.email)}" readonly`:''}>`}</div>`).join('')}<div class="hp"><input id="hp" tabindex="-1"></div><button class="go" id="place" disabled>📨 Ipadala ang Reservation</button>`:'<p>Wala pang published prices.</p>'}</div><details class="card"><summary>🏪 Mga Distributor</summary>${dist.map(d=>`<p><b>${esc(d.label)}</b> · ${esc(d.area||'')} · ${esc(d.type||'')}</p>`).join('')||'Wala pang nakalista.'}</details><p style="text-align:center"><a href="https://www.facebook.com/DWBE.23" target="_blank" rel="noopener">Facebook Page</a></p>`);document.getElementById('logout').onclick=()=>signOut(auth);if(last?.id){orderUnsub=onSnapshot(doc(db,orders,last.id),s=>{let e=document.getElementById('lastStatus');if(e)e.textContent=s.exists()?'Status: '+s.data().status:'Hindi makita ang order'},()=>{})}if(!products.length)return;root.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{let p=b.dataset.p;cart[p]=Math.max(0,Math.min(50,cart[p]+Number(b.dataset.d)));refresh()});document.getElementById('minor').onclick=()=>setPriority('Minor');document.getElementById('urgent').onclick=()=>setPriority('Urgent');document.getElementById('redeem').oninput=refresh;document.getElementById('place').onclick=place;refresh();loadDates()}
function setPriority(p){priority=p;document.getElementById('minor').classList.toggle('active',p==='Minor');document.getElementById('urgent').classList.toggle('active',p==='Urgent');refresh()}
function refresh(){let x=calc();for(let p of ['Ordinary','Premium']){let q=document.getElementById('q_'+p);if(q)q.textContent=cart[p]}for(let [id,v]of Object.entries({pcs:x.pcs+' pcs / minimum 7',subtotal:money(x.subtotal),discount:'−'+money(x.discount),urgentFee:money(x.urgent),coinsOff:'−'+money(x.used),total:money(x.total),earn:x.earn+' coins kapag Completed'}))document.getElementById(id).textContent=v;document.getElementById('place').disabled=x.pcs<7||!date||!slot;root.querySelectorAll('.step button').forEach(b=>b.disabled=Number(b.dataset.d)<0?cart[b.dataset.p]===0:cart[b.dataset.p]>=50)}
async function loadDates(){const box=document.getElementById('days');if(!box)return;box.innerHTML='';for(let i=5;i<35;i++){let d=day(i),b=document.createElement('button');b.textContent=new Date(d+'T12:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric'});b.onclick=()=>selectDate(d);box.append(b)}if(date)await selectDate(date)}
async function selectDate(d){date=d;slot=0;root.querySelectorAll('#days button').forEach(b=>b.classList.toggle('active',b.textContent===new Date(d+'T12:00:00').toLocaleDateString('en-PH',{month:'short',day:'numeric'})));document.getElementById('dateLabel').textContent='Pickup: '+d;const box=document.getElementById('slots');box.textContent='Kinukuha ang available slots...';try{const statuses=await Promise.all([1,2,3,4].map(n=>getDoc(doc(db,slots,d+'_'+n))));if(date!==d)return;box.innerHTML='';statuses.forEach((s,i)=>{let n=i+1,b=document.createElement('button');b.textContent='Slot '+n+(s.exists()?' · Booked':' · Available');b.disabled=s.exists();b.onclick=()=>{slot=n;box.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');refresh()};box.append(b)})}catch(e){box.textContent='Hindi makuha ang slots: '+(e.code||e.message)}refresh()}
async function place(){let x=calc(),v=id=>document.getElementById('f_'+id).value.trim(),name=v('name'),phone=v('phone'),email=v('email').toLowerCase(),address=v('address'),note=v('note');if(document.getElementById('hp').value)return;if(x.pcs<7||!date||!slot)return error('Pumili ng 7 pcs at available pickup slot.');if(name.length<2||phone.length<7||address.length<8)return error('Kumpletuhin ang pangalan, telepono at address.');if(email!==user.email.toLowerCase())return error('Hindi tugma ang account email.');let prev;try{prev=JSON.parse(localStorage.getItem(lastKey)||'null')}catch{}if(prev?.at&&Date.now()-prev.at<60000)return error('Maghintay muna ng 1 minuto bago muling mag-order.');let items=['Ordinary','Premium'].filter(p=>cart[p]>0).map(p=>({style:p,qty:cart[p],price:Number(pub.prices[p])})),id=doc(collection(db,orders)),slotRef=doc(db,slots,date+'_'+slot),data={name,phone,email,address,note,items,total:x.total,status:'Pending',createdAt:Date.now(),source:'buyer-app',buyerUid:user.uid,coinsRequested:x.used,priority,pickupDate:date,slotNumber:slot,subtotal:x.subtotal,discount:x.discount,urgentCharge:x.urgent};let btn=document.getElementById('place');btn.disabled=true;btn.textContent='Ipinapadala...';try{await runTransaction(db,async tx=>{const s=await tx.get(slotRef);if(s.exists())throw Error('Nakuha na ang slot. Pumili ng iba.');tx.set(slotRef,{orderId:id.id,buyerUid:user.uid,pickupDate:date,slotNumber:slot,createdAt:data.createdAt});tx.set(id,data)});try{localStorage.setItem(lastKey,JSON.stringify({id:id.id,total:x.total,at:Date.now()}))}catch{}show(`<div class="card"><h2>✅ Naipadala ang reservation!</h2><div class="code">${esc(id.id.slice(0,6).toUpperCase())}</div><p>Pickup: ${esc(date)} · Slot ${slot} · ${esc(priority)}</p><p>Regular: ${money(x.subtotal)}<br>5% off: −${money(x.discount)}<br>Urgent: ${money(x.urgent)}<br>Coins: −${money(x.used)}</p><h2>Total: ${money(x.total)}</h2><p>🪙 ${x.earn} pending coins kapag Completed.</p><p id="doneStatus">Pending</p><button class="go" id="again">Bumalik sa tindahan</button></div>`);onSnapshot(id,s=>{let e=document.getElementById('doneStatus');if(e&&s.exists())e.textContent='Status: '+s.data().status});document.getElementById('again').onclick=initStore}catch(e){error('Hindi na-book: '+(e.code||e.message));btn.disabled=false;btn.textContent='📨 Ipadala ang Reservation';await selectDate(date)}}
async function initQr(){try{const s=await getDoc(doc(db,qrCol,token));if(!s.exists())throw Error('Hindi makita ang QR');qr=s.data();if(qr.status!=='open'||qr.expiresAt&&Date.now()>qr.expiresAt)throw Error('Nagamit na o expired ang QR');qrStyle=qr.styles?.[0]?.styleType||'';renderQr()}catch(e){error(e.message)}}function renderQr(){let styles=qr.styles||[],max=Math.min(50,Number(qr.maxQty||10),Number(styles.find(s=>s.styleType===qrStyle)?.stock||10));qrQty=Math.min(qrQty,Math.max(1,max));show(`<div class="card"><h2>🎟️ Distributor QR</h2><h3>${esc(qr.maskedName)}</h3><div class="promo">${money(qr.discountPerPc)} OFF bawat piraso</div>${styles.map(s=>`<button class="tab ${s.styleType===qrStyle?'active':''}" data-style="${esc(s.styleType)}">${esc(s.styleType)} (${esc(s.stock)})</button>`).join('')}<div class="row"><button class="tab" id="minus">−</button><b>${qrQty} pcs</b><button class="tab" id="plus">+</button></div><p>Discount: ${money(qrQty*Number(qr.discountPerPc))}</p><button class="go" id="submitQr">Kumpirmahin ang pagbili</button></div>`);root.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{qrStyle=b.dataset.style;renderQr()});document.getElementById('minus').onclick=()=>{qrQty=Math.max(1,qrQty-1);renderQr()};document.getElementById('plus').onclick=()=>{qrQty=Math.min(max,qrQty+1);renderQr()};document.getElementById('submitQr').onclick=async()=>{try{await updateDoc(doc(db,qrCol,token),{status:'scanned',style:qrStyle,qty:qrQty,scannedAt:Date.now()});show('<div class="card" id="qrStatus">⏳ Hinihintay ang distributor...</div>');onSnapshot(doc(db,qrCol,token),s=>{let d=s.data()||{},el=document.getElementById('qrStatus');if(!el)return;if(d.status==='recorded')el.textContent='✅ Naitala na! Code: '+token.slice(-4).toUpperCase();if(d.status==='rejected')el.textContent='❌ Tinanggihan: '+(d.reason||'')})}catch(e){error('Hindi naipadala: '+(e.code||e.message))}}}if(token)initQr();
</script></body></html>
