<!doctype html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor's Whisk Broom · Buyer</title><style>
:root{--g:#185c38}*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#173d29;font:16px system-ui,Arial}header{background:var(--g);color:white;padding:17px;font-weight:900}main{max-width:560px;margin:auto;padding:14px}.card,details{background:white;border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 12px #0001}details summary{font-weight:800;color:var(--g);cursor:pointer}details>div{padding-top:14px}h2{color:var(--g);font-size:1.25rem}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px}.nav button,.go{border:0;border-radius:11px;background:var(--g);color:white;padding:14px;font-weight:850;font-size:1rem;cursor:pointer}.nav button:last-child{grid-column:span 2}.go{width:100%;margin:8px 0}.nav button:nth-child(2){background:#a65b00}.nav button:nth-child(3){background:#1661a8}.nav button:nth-child(4){background:#6a258e}.nav button:last-child{background:#00695c}.row{display:flex;justify-content:space-between;gap:8px;margin:9px 0}.prod{border:1px solid #ddd;border-radius:12px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;align-items:center}.step{display:flex;align-items:center;gap:9px}.step button{width:42px;height:42px;border-radius:50%;border:0;background:var(--g);color:white;font-size:1.5rem}.field{margin:13px 0}.field label{display:block;font-weight:700;margin-bottom:5px}input,textarea{font:inherit;border:1px solid #bccdc2;border-radius:9px;padding:11px;width:100%}.summary{background:#e8f5e9;padding:14px;border-radius:12px}.promo{background:#fff7d9;padding:12px;border-radius:12px}.error{color:#b71c1c;background:#ffebee;padding:12px;border-radius:10px}.notice{background:#e3f2fd;border-left:5px solid #1565c0;padding:11px;margin:10px 0;border-radius:9px}.code{font-size:1.7rem;font-weight:900;letter-spacing:3px;color:var(--g)}.order{border-left:5px solid #2e7d32;border-radius:9px;padding:12px;margin:12px 0;background:#f7faf8}.muted{color:#65766d;font-size:.87rem}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gallery img{width:100%;height:180px;object-fit:contain;background:#fafafa;border-radius:10px}.gallery figure{margin:0}.gallery button{padding:8px;background:var(--g);color:#fff;border:0;border-radius:8px}.hidden{display:none}.chips{display:flex;gap:8px}.chips button{flex:1;padding:13px;border:2px solid #ddd;border-radius:9px;background:#fff;font-weight:800}.chips button.active{border-color:var(--g);background:#e8f5e9}.small{font-size:.85rem}button:disabled{opacity:.5}.status{font-weight:800;color:#1565c0}.link{background:none;border:0;text-decoration:underline;color:var(--g);padding:10px;cursor:pointer}
</style></head><body><header>🧹 Doctor's Whisk Broom · Buyer <span id="mode"></span></header><main id="app">Binubuksan...</main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import{getFirestore,doc,getDoc,updateDoc,onSnapshot,collection,addDoc,query,where}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us',authDomain:'dwbe-consignment.firebaseapp.com',projectId:'dwbe-consignment',storageBucket:'dwbe-consignment.firebasestorage.app',messagingSenderId:'205759197252',appId:'1:205759197252:web:b04400821f81791d10cc11'},'buyer');
const db=getFirestore(app),auth=getAuth(app),p=new URLSearchParams(location.search),TEST=p.get('test')==='1',TOKEN=p.get('q'),OC=TEST?'buyer_orders_test':'buyer_orders',WC=TEST?'buyer_wallets_test':'buyer_wallets',QC=TEST?'buyer_qr_test':'buyer_qr',PD=TEST?'directory_test':'directory',LK='dwbe_last_order'+(TEST?'_test':'');
const root=document.getElementById('app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),peso=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),code=id=>String(id||'').slice(0,6).toUpperCase();document.getElementById('mode').textContent=TEST?'🧪 TESTING MODE':'🔴 LIVE MODE';
let user=null,pub={},wallet=0,cart={Ordinary:0,Premium:0},priority='Minor',unsubs=[],orders=[];function clean(){unsubs.forEach(f=>f());unsubs=[]}function msg(t,b=false){root.innerHTML='<div class="card '+(b?'error':'')+'">'+esc(t)+'</div>'}function dateText(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s||''))return'Itatakda ng Admin';return new Date(s+'T12:00:00+08:00').toLocaleDateString('fil-PH',{year:'numeric',month:'long',day:'numeric',weekday:'short',timeZone:'Asia/Manila'})}function pickupNotice(o){if(o.status==='Rejected')return'❌ Hindi naaprubahan ang order';if(o.status==='Completed')return'🏁 Completed na ang order';if(o.pickupReady===true)return'✅ FOR PICKUP NA! '+dateText(o.pickupDate);if(o.pickupDate)return'📅 Pickup schedule: '+dateText(o.pickupDate)+' · ⏳ Unavailable pa / hindi pa ready';return'⏳ UNAVAILABLE PA — Naghihintay ng pickup schedule mula sa Admin'}
function authUI(mode='login',email=''){root.innerHTML=`<div class="card"><h2>${mode==='register'?'Gumawa ng Account':mode==='reset'?'I-reset ang Password':'DWBE Rewards Login'}</h2><form id="form"><div class="field"><label>Email</label><input id="email" type="email" value="${esc(email)}" required></div>${mode==='reset'?'':`<div class="field"><label>Password</label><input id="pass" type="password" minlength="6" required></div>`}${mode==='register'?'<div class="field"><label>Ulitin ang Password</label><input id="confirm" type="password" minlength="6" required></div>':''}<div id="err"></div><button class="go" id="submit">${mode==='register'?'Gumawa ng Account':mode==='reset'?'Ipadala ang Reset Link':'Mag-login'}</button></form><div style="text-align:center">${mode==='login'?'<button class="link" id="reg">Mag-register</button><button class="link" id="reset">Nakalimutan ang password?</button>':'<button class="link" id="login">Bumalik sa Login</button>'}</div></div>`;const go=m=>authUI(m,document.getElementById('email').value);if(mode==='login'){document.getElementById('reg').onclick=()=>go('register');document.getElementById('reset').onclick=()=>go('reset')}else document.getElementById('login').onclick=()=>go('login');document.getElementById('form').onsubmit=async e=>{e.preventDefault();const b=document.getElementById('submit'),email=document.getElementById('email').value.trim().toLowerCase(),pass=document.getElementById('pass')?.value||'';if(mode==='register'&&pass!==document.getElementById('confirm').value){document.getElementById('err').textContent='Hindi magkapareho ang password.';return}b.disabled=true;try{if(mode==='register')await createUserWithEmailAndPassword(auth,email,pass);else if(mode==='login')await signInWithEmailAndPassword(auth,email,pass);else{await sendPasswordResetEmail(auth,email);document.getElementById('err').textContent='Tingnan ang email para sa reset link.'}}catch(x){document.getElementById('err').textContent='Error: '+(x.code||x.message)}finally{b.disabled=false}}}
function ordersHTML(){return orders.slice().sort((a,b)=>b.createdAt-a.createdAt).map(o=>`<div class="order"><div class="row"><b>Code: ${esc(code(o.id))}</b><b>${esc(o.status)}</b></div>${(o.items||[]).map(i=>`<div>🧹 ${esc(i.style)} × ${Number(i.qty)}</div>`).join('')}<div>⚡ ${o.priority==='Urgent'?'High / Urgent':'Minor'}</div><div>💵 ${peso(o.total)}</div><div class="notice"><b>${esc(pickupNotice(o))}</b></div>${Number(o.coinsEarned)>0?`<div>🪙 Na-credit: +${Number(o.coinsEarned)}</div>`:''}</div>`).join('')||'<p>Wala ka pang order.</p>'}function redrawOrders(){const x=document.getElementById('orders');if(x)x.innerHTML=ordersHTML();const badge=document.getElementById('orderCount');if(badge)badge.textContent='📦 Mga Order Ko ('+orders.length+')'}
function store(){const prices=pub.prices||{},styles=['Ordinary','Premium'].filter(s=>Number(prices[s])>0);root.innerHTML=`<nav class="nav"><button data-go="wallet">🪙 Wallet</button><button data-go="gallery">🧹 Walis</button><button data-go="buy">🛒 Order</button><button data-go="mine">📦 Mga Order Ko</button></nav><div class="card"><h2>🧹 Bumili nang Direkta</h2><p>Doctor's Whisk Broom etc., Sorsogon</p><p class="promo">📅 Ang Admin ang magtatakda ng pickup schedule pagkatapos mong mag-order. Makikita mo ang notification sa Mga Order Ko.</p></div><details id="wallet"><summary>🪙 DWBE Wallet — <span id="balance">${wallet}</span> coins</summary><div><p>Account: ${esc(user.email)}</p><p>1 coin = ₱1 · 2 coins bawat 7 pcs, credited kapag Completed.</p><button class="link" id="logout">Mag-logout</button></div></details><details id="gallery"><summary>🧹 Mga Larawan ng Walis Tambo (6)</summary><div class="gallery">${['Ordinary','Premium'].map(s=>`<figure><img id="img_${s}" alt="${s}"><figcaption>${s}</figcaption><button data-img="${s}" data-dir="-1">❮</button> <span id="cnt_${s}">1/3</span> <button data-img="${s}" data-dir="1">❯</button></figure>`).join('')}</div></details><details id="mine" open><summary id="orderCount">📦 Mga Order Ko</summary><div id="orders">Kinukuha ang mga order...</div></details><div class="card" id="buy"><h2>🛒 Mag-order</h2><p class="promo">🏷️ Automatic 5% OFF sa regular na subtotal. Minimum 7 pcs bawat order. Admin ang magtatakda ng pickup schedule para sa malalaking order.</p>${styles.map(s=>`<div class="prod"><div><b>${s}</b><div>${peso(prices[s])} / pc</div></div><div class="step"><button data-style="${s}" data-n="-1">−</button><b id="qty_${s}">0</b><button data-style="${s}" data-n="1">+</button></div></div>`).join('')}<div class="field"><label>⚡ Priority</label><div class="chips"><button id="minor" class="active">Minor · Walang dagdag</button><button id="urgent">High / Urgent · +₱20/pc</button></div></div><div class="notice">📅 Pickup: <b>Itatakda ng Admin</b><br>⏳ Unavailable pa hanggang kumpirmahin ng Admin na for pickup na.</div><div class="summary"><div class="row"><span>Quantity</span><b id="pcs">0 pcs</b></div><div class="row"><span>Regular subtotal</span><b id="subtotal">₱0</b></div><div class="row"><span>5% OFF</span><b id="discount">₱0</b></div><div class="row"><span>Urgent fee</span><b id="rush">₱0</b></div><div class="row"><span>Coins (max 20)</span><input style="width:75px" type="number" id="redeem" value="0" min="0" max="20"></div><hr><div class="row"><b>Kabuuan</b><b id="total">₱0</b></div><div class="small">🪙 Coins kapag Completed: <span id="earn">0</span></div></div>${[['name','Pangalan','text'],['phone','Telepono / GCash','tel'],['address','Address','textarea'],['note','Tala (opsyonal)','textarea']].map(([id,label,type])=>`<div class="field"><label>${label}</label>${type==='textarea'?`<textarea id="${id}" rows="2" maxlength="${id==='address'?200:200}"></textarea>`:`<input id="${id}" type="${type}" maxlength="${id==='name'?80:20}">`}</div>`).join('')}<div id="senderr"></div><button class="go" id="send" disabled>📨 Ipadala ang Order</button><p class="muted">Hindi pa ito bayad. Admin ang magbibigay ng pickup date.</p></div><p style="text-align:center"><a href="https://www.facebook.com/DWBE.23" target="_blank" rel="noopener">Facebook Page</a></p>`;
const index={Ordinary:0,Premium:0},base='https://raw.githubusercontent.com/doctorjiemar0-dotcom/DWBE-AGREEMENTS/main/';function drawImg(s){const i=index[s],f=s+(i?'-'+(i+1):'')+'.jpg';document.getElementById('img_'+s).src=base+f;document.getElementById('cnt_'+s).textContent=(i+1)+'/3'}['Ordinary','Premium'].forEach(drawImg);document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>{const s=b.dataset.img;index[s]=(index[s]+Number(b.dataset.dir)+3)%3;drawImg(s)});document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const x=document.getElementById(b.dataset.go);if(x.tagName==='DETAILS')x.open=true;x.scrollIntoView({behavior:'smooth'})});document.getElementById('logout').onclick=()=>signOut(auth);
const calc=()=>{let pcs=0,subtotal=0;for(const s of styles){pcs+=cart[s];subtotal+=cart[s]*Number(prices[s])}subtotal=Math.round(subtotal*100)/100;const discount=Math.round(subtotal*.05*100)/100,rush=priority==='Urgent'?pcs*20:0,raw=Math.floor(Number(document.getElementById('redeem').value)||0),coins=Math.max(0,Math.min(20,wallet,raw,Math.floor(subtotal-discount)));return{pcs,subtotal,discount,rush,coins,total:Math.round((subtotal-discount+rush-coins)*100)/100}};function refresh(){const x=calc();for(const s of styles)document.getElementById('qty_'+s).textContent=cart[s];for(const [id,value]of Object.entries({pcs:x.pcs+' pcs',subtotal:peso(x.subtotal),discount:'−'+peso(x.discount),rush:'+'+peso(x.rush),total:peso(x.total),earn:Math.floor(x.pcs/7)*2}))document.getElementById(id).textContent=value;document.getElementById('send').disabled=x.pcs<7;document.querySelectorAll('[data-style]').forEach(b=>b.disabled=Number(b.dataset.n)>0?cart[b.dataset.style]>=50:cart[b.dataset.style]<=0)}document.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{cart[b.dataset.style]=Math.max(0,Math.min(50,cart[b.dataset.style]+Number(b.dataset.n)));refresh()});document.getElementById('minor').onclick=()=>{priority='Minor';document.getElementById('minor').classList.add('active');document.getElementById('urgent').classList.remove('active');refresh()};document.getElementById('urgent').onclick=()=>{priority='Urgent';document.getElementById('urgent').classList.add('active');document.getElementById('minor').classList.remove('active');refresh()};document.getElementById('redeem').oninput=refresh;refresh();
document.getElementById('send').onclick=async()=>{const x=calc(),name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim(),address=document.getElementById('address').value.trim(),note=document.getElementById('note').value.trim(),err=document.getElementById('senderr'),btn=document.getElementById('send');err.textContent='';if(x.pcs<7)return;if(name.length<2||name.length>80||phone.length<7||address.length<8){err.innerHTML='<p class="error">Kumpletuhin ang pangalan, telepono at address.</p>';return}btn.disabled=true;btn.textContent='Ipinapadala...';try{const items=styles.filter(s=>cart[s]).map(s=>({style:s,qty:cart[s],price:Number(prices[s])})),data={name,phone,email:user.email,address,note,items,total:x.total,status:'Pending',createdAt:Date.now(),source:'buyer-app',buyerUid:user.uid,coinsRequested:x.coins,priority};const ref=await addDoc(collection(db,OC),data);try{localStorage.setItem(LK,JSON.stringify({id:ref.id,uid:user.uid,total:x.total,at:Date.now()}))}catch{}root.innerHTML=`<div class="card"><h2>✅ Naipadala na ang order!</h2><div class="code">${code(ref.id)}</div><p>💵 Total: ${peso(x.total)}</p><div class="notice" id="done">⏳ Unavailable pa — Admin ang magbibigay ng pickup schedule.</div><p>Itago ang code. Makikita rin ito ng Admin at sa Mga Order Ko.</p><button class="go" id="back">Bumalik sa Tindahan</button></div>`;unsubs.push(onSnapshot(doc(db,OC,ref.id),s=>{const el=document.getElementById('done');if(el&&s.exists())el.textContent=pickupNotice(s.data())}));document.getElementById('back').onclick=store}catch(e){err.innerHTML='<p class="error">Hindi naipadala: '+esc(e.code||e.message)+'. Kung permission-denied, kailangang i-publish ang kasamang Firestore Rules.</p>';btn.disabled=false;btn.textContent='📨 Ipadala ang Order'}};
unsubs.push(onSnapshot(query(collection(db,OC),where('buyerUid','==',user.uid)),snap=>{orders=snap.docs.map(d=>({id:d.id,...d.data()}));redrawOrders()},e=>{const el=document.getElementById('orders');if(el)el.innerHTML='<p class="error">Hindi ma-load ang orders: '+esc(e.code)+'</p>'}));unsubs.push(onSnapshot(doc(db,WC,user.uid),snap=>{wallet=Math.max(0,Math.floor(Number(snap.data()?.balance||0)));const el=document.getElementById('balance');if(el)el.textContent=wallet;if(document.getElementById('pcs'))refresh()}));}
onAuthStateChanged(auth,async u=>{if(TOKEN)return;clean();user=u;if(!u){authUI();return}msg('Binubuksan ang tindahan...');try{const s=await getDoc(doc(db,'buyer_public',PD));pub=s.data()||{};cart={Ordinary:0,Premium:0};priority='Minor';store()}catch(e){msg('Hindi ma-load ang tindahan: '+(e.code||e.message),true)}});
async function qrStart(){try{const ref=doc(db,QC,TOKEN),s=await getDoc(ref);if(!s.exists())return msg('Hindi nahanap ang QR.',true);const q=s.data();if(q.status!=='open')return msg('Nagamit na ang QR.');if(q.expiresAt&&Date.now()>q.expiresAt)return msg('Expired na ang QR.',true);let style=q.styles?.[0]?.styleType||'Ordinary',qty=1;function render(){const cur=q.styles?.find(x=>x.styleType===style),max=Math.max(1,Math.min(50,q.maxQty||10,cur?.stock||10));qty=Math.min(qty,max);root.innerHTML=`<div class="card"><h2>DISTRIBUTOR: ${esc(q.maskedName)}</h2><p>🎟️ ${peso(q.discountPerPc)} OFF bawat walis tambo</p>${(q.styles||[]).map(x=>`<button class="link" data-style="${esc(x.styleType)}">${esc(x.styleType)} (${x.stock} pcs)</button>`).join('')}<p>${esc(style)} × ${qty}</p><button class="link" id="minus">−</button><button class="link" id="plus">＋</button><p>Discount: ${peso(qty*q.discountPerPc)}</p><button class="go" id="confirm">Kumpirmahin</button></div>`;root.querySelectorAll('[data-style]').forEach(b=>b.onclick=()=>{style=b.dataset.style;render()});document.getElementById('minus').onclick=()=>{qty=Math.max(1,qty-1);render()};document.getElementById('plus').onclick=()=>{qty=Math.min(max,qty+1);render()};document.getElementById('confirm').onclick=async()=>{try{await updateDoc(ref,{status:'scanned',style,qty,scannedAt:Date.now()});msg('⏳ Hinihintay ang kumpirmasyon ng distributor...');unsubs.push(onSnapshot(ref,ss=>{const d=ss.data()||{};if(d.status==='recorded')msg('✅ Naitala na! Code: '+TOKEN.slice(-4).toUpperCase()+' · Discount: '+peso(d.discount));if(d.status==='rejected')msg('Hindi naitala ang QR.',true)}))}catch(e){msg('QR error: '+(e.code||e.message),true)}}}render()}catch(e){msg('Hindi ma-load ang QR: '+(e.code||e.message),true)}}if(TOKEN)qrStart();
</script></body></html>
