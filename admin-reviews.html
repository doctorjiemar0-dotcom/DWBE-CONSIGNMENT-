<!doctype html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>DWBE Admin · Reviews</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#173d29;font:15px/1.4 system-ui,Arial}header{background:#185c38;color:#fff;padding:12px 14px;font-weight:800}main{max-width:620px;margin:auto;padding:8px 10px}.card{background:#fff;border-radius:14px;padding:13px;margin:8px 0;box-shadow:0 1px 8px #0000000f}input{font:inherit;border:1px solid #bccdc2;border-radius:9px;padding:10px;width:100%;margin:5px 0}button{border:0;border-radius:9px;background:#185c38;color:#fff;padding:9px 12px;font-weight:700;cursor:pointer;margin:4px 4px 0 0}.b2{background:#c62828}.b3{background:#607d8b}.b4{background:#1661a8}.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:.72rem;font-weight:800;color:#fff}.hidden{display:none}.muted{color:#65766d;font-size:.82rem}.f{display:flex;gap:6px;overflow-x:auto;padding:6px 0}.f button{flex:none;background:#f1f8e9;color:#33691e;border:1px solid #c5e1a5}.f button.on{background:#185c38;color:#fff}img{width:100%;border-radius:10px;margin:6px 0}.err{background:#ffebee;color:#b71c1c;border-radius:9px;padding:9px;margin:6px 0}
</style></head><body><header>⭐ DWBE Admin · Mga Review <span id="mode"></span></header><main>
<div class="card" id="login"><b>Admin Login</b><input id="em" type="email" value="admin@admin.com" autocapitalize="none"><input id="pw" type="password" placeholder="Password"><div id="le"></div><button id="lb">Mag-login</button></div>
<div id="panel" class="hidden"><div class="f" id="bar"></div><div id="list"></div><button class="b3" id="lo">Mag-logout</button></div>
</main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import{getFirestore,collection,getDocs,getDoc,doc,updateDoc,deleteDoc}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';
import{getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us',authDomain:'dwbe-consignment.firebaseapp.com',projectId:'dwbe-consignment',storageBucket:'dwbe-consignment.firebasestorage.app',messagingSenderId:'205759197252',appId:'1:205759197252:web:b04400821f81791d10cc11'},'admin-reviews');
const db=getFirestore(app),auth=getAuth(app),$=id=>document.getElementById(id),TEST=new URLSearchParams(location.search).get('test')==='1',RC=TEST?'buyer_reviews_test':'buyer_reviews',IC=TEST?'buyer_review_images_test':'buyer_review_images';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('mode').textContent=TEST?'🧪 TEST':'🔴 LIVE';
let rows=[],flt='Pending';const COL={Pending:'#f57c00',Approved:'#2e7d32',Rejected:'#c62828',Hidden:'#607d8b'};
onAuthStateChanged(auth,u=>{$('login').classList.toggle('hidden',!!u);$('panel').classList.toggle('hidden',!u);if(u)load()});
$('lb').onclick=async()=>{$('le').innerHTML='';try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){$('le').innerHTML='<div class="err">'+esc(e.code||e.message)+'</div>'}};
$('lo').onclick=()=>signOut(auth);
async function load(){$('list').innerHTML='<p class="muted">Kinukuha...</p>';try{const s=await getDocs(collection(db,RC));rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));draw()}catch(e){$('list').innerHTML='<div class="err">Hindi ma-load: '+esc(e.code||e.message)+'</div>'}}
function st(r){return r.moderationStatus||'Approved'}
function draw(){const cnt=k=>k==='all'?rows.length:rows.filter(r=>st(r)===k).length;$('bar').innerHTML=[['Pending','Naghihintay'],['Approved','Aprubado'],['Rejected','Tinanggihan'],['Hidden','Nakatago'],['all','Lahat']].map(([k,l])=>`<button class="${flt===k?'on':''}" data-f="${k}">${l} (${cnt(k)})</button>`).join('');
const v=rows.filter(r=>flt==='all'||st(r)===flt);
$('list').innerHTML=v.map(r=>`<div class="card"><div><b>${esc(r.buyerName)}</b> <span class="muted">📍 ${esc(r.buyerArea)} · Order ${esc(String(r.orderId||r.id).slice(0,6).toUpperCase())}</span> <span class="tag" style="background:${COL[st(r)]||'#777'}">${esc(st(r))}</span></div>${(r.ratings||[]).map(x=>`<div>🧹 ${esc(x.style)} · ${'★'.repeat(x.stars)}${'☆'.repeat(5-x.stars)}</div>`).join('')}${r.comment?`<p>${esc(r.comment)}</p>`:'<p class="muted">Walang komento.</p>'}${r.photoCount?`<button class="b4" data-ph="${r.id}">📷 Tingnan ang larawan (${r.photoCount})</button><div id="ph_${r.id}"></div>`:''}<div><button data-a="Approved" data-id="${r.id}">✅ Aprubahan</button><button class="b3" data-a="Hidden" data-id="${r.id}">🙈 Itago</button><button class="b2" data-a="Rejected" data-id="${r.id}">❌ Tanggihan</button><button class="b2" data-del="${r.id}">🗑️ Burahin</button></div></div>`).join('')||'<p class="muted">Walang review sa kategoryang ito.</p>';
document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;draw()});
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{try{await updateDoc(doc(db,RC,b.dataset.id),{moderationStatus:b.dataset.a,moderatedAt:Date.now()});const r=rows.find(x=>x.id===b.dataset.id);r.moderationStatus=b.dataset.a;draw()}catch(e){alert('Hindi na-update: '+(e.code||e.message))}});
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Burahin ang review (at larawan nito)?'))return;try{await deleteDoc(doc(db,RC,b.dataset.del));try{await deleteDoc(doc(db,IC,b.dataset.del))}catch(_){}rows=rows.filter(x=>x.id!==b.dataset.del);draw()}catch(e){alert('Hindi nabura: '+(e.code||e.message))}});
document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=async()=>{const box=$('ph_'+b.dataset.ph);box.innerHTML='<span class="muted">Kinukuha...</span>';try{const s=await getDoc(doc(db,IC,b.dataset.ph));box.innerHTML=s.exists()?(s.data().images||[]).map(u=>`<img src="${esc(u)}" alt="Larawan ng review">`).join(''):'<span class="muted">Walang larawan.</span>'}catch(e){box.innerHTML='<div class="err">'+esc(e.code||e.message)+'</div>'}})}
</script></body></html>
