<!doctype html><html lang="tl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>DWBE · I-reset ang Password</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f5;color:#173d29;font:16px system-ui,Arial}header{background:#185c38;color:#fff;padding:17px;font-weight:900}main{max-width:480px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}h2{color:#185c38;margin-top:0}.field{margin:13px 0}label{display:block;font-weight:700;margin-bottom:5px}input{font:inherit;border:1px solid #bccdc2;border-radius:9px;padding:12px;width:100%}.go{display:block;width:100%;border:0;border-radius:11px;background:#185c38;color:#fff;padding:14px;font-weight:850;font-size:1rem;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px}.go:disabled{opacity:.5}.error{color:#b71c1c;background:#ffebee;padding:12px;border-radius:10px}.ok{color:#1b5e20;background:#e8f5e9;padding:12px;border-radius:10px}.muted{color:#65766d;font-size:.9rem}
</style></head><body><header>🧹 Doctor's Whisk Broom · I-reset ang Password</header><main><div class="card" id="box">Sinusuri ang link...</div></main><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
import{getAuth,verifyPasswordResetCode,confirmPasswordReset}from'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
const app=initializeApp({apiKey:'AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us',authDomain:'dwbe-consignment.firebaseapp.com',projectId:'dwbe-consignment',storageBucket:'dwbe-consignment.firebasestorage.app',messagingSenderId:'205759197252',appId:'1:205759197252:web:b04400821f81791d10cc11'},'buyer-reset');
const auth=getAuth(app),box=document.getElementById('box'),p=new URLSearchParams(location.search),mode=p.get('mode'),code=p.get('oobCode');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const back='<a class="go" href="/buyer.html">Bumalik sa Login</a>';
const fail=x=>{const c=x?.code||'';box.innerHTML='<h2>Hindi gumana ang link</h2><p class="error">'+(c.includes('expired')||c.includes('invalid')?'Luma na o nagamit na ang link na ito.':'May problema: '+esc(c||x?.message||'unknown'))+'</p><p class="muted">Bumalik sa login, i-tap ang "Nakalimutan ang password?" at humingi ng bagong link. Gamitin ang pinakabagong email lang.</p>'+back};
(async()=>{
if(mode!=='resetPassword'||!code){box.innerHTML='<h2>Walang valid na link</h2><p class="muted">Humingi ng bagong reset link mula sa login page.</p>'+back;return}
let email;try{email=await verifyPasswordResetCode(auth,code)}catch(x){return fail(x)}
box.innerHTML='<h2>Bagong Password</h2><p class="muted">Account: <b>'+esc(email)+'</b></p><form id="f"><div class="field"><label>Bagong Password</label><input id="a" type="password" minlength="6" autocomplete="new-password" required></div><div class="field"><label>Ulitin ang Password</label><input id="b" type="password" minlength="6" autocomplete="new-password" required></div><div id="m"></div><button class="go" id="s">I-save ang Password</button></form>';
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const a=document.getElementById('a').value,m=document.getElementById('m'),s=document.getElementById('s');if(a!==document.getElementById('b').value){m.innerHTML='<p class="error">Hindi magkapareho ang password.</p>';return}s.disabled=true;s.textContent='Sine-save...';try{await confirmPasswordReset(auth,code,a);box.innerHTML='<h2>✅ Tapos na!</h2><p class="ok">Napalitan na ang password mo. Mag-login na gamit ang bago.</p>'+back}catch(x){fail(x)}}
})();
</script></body></html>
