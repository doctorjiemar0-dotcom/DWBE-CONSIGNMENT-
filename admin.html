<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Whisk Broom - Admin Panel</title>
    <meta name="theme-color" content="#2e7d32">
    <style>
        :root { --primary-color: #2e7d32; --secondary-color: #4caf50; --background-color: #f4f6f8; --text-color: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background-color); color: var(--text-color); padding-bottom: 50px; }
        header { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0px 2px 4px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { font-size: 1rem; margin-bottom: 10px; color: var(--primary-color); }
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 3px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        button { background-color: var(--secondary-color); color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #388e3c; }

        #syncStatus { text-align: center; font-size: 0.8rem; color: #666; margin-bottom: 10px; font-style: italic; }

        .store-item-box { background: #f9f9f9; border: 1px solid #ddd; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .badge { background: #e8f5e9; color: #2e7d32; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge.online { background: #e3f2fd; color: #0288d1; }
        .inquiry-box { background: #fff8e1; border: 1px solid #ffe082; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <header>🧹 Doctor's Whisk Broom - Admin Panel</header>

    <div class="container">
        <div id="syncStatus">Kumokonekta sa Cloud Database...</div>

        <!-- Main Inventory Card -->
        <div class="card">
            <h2>📦 Main Inventory (Bodega)</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <div style="flex: 1; background: #e8f5e9; padding: 10px; border-radius: 6px; text-align: center;">
                    <span style="font-size: 0.8rem; color: #555;">Ordinary Style</span>
                    <h3 id="homeOrdinaryStock" style="color: #2e7d32; font-size: 1.2rem;">0</h3>
                </div>
                <div style="flex: 1; background: #e3f2fd; padding: 10px; border-radius: 6px; text-align: center;">
                    <span style="font-size: 0.8rem; color: #555;">Premium Style</span>
                    <h3 id="homePremiumStock" style="color: #0288d1; font-size: 1.2rem;">0</h3>
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Dagdag Ordinary:</label>
                    <input type="number" id="addOrdinaryQty" value="10" min="1">
                    <button type="button" onclick="updateHomeStock('Ordinary')" style="background-color: #2e7d32; padding: 8px; font-size: 0.9rem;">Idagdag sa Bodega</button>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Dagdag Premium:</label>
                    <input type="number" id="addPremiumQty" value="10" min="1">
                    <button type="button" onclick="updateHomeStock('Premium')" style="background-color: #0288d1; padding: 8px; font-size: 0.9rem;">Idagdag sa Bodega</button>
                </div>
            </div>
        </div>

        <!-- Pending Inquiries Section -->
        <div class="card" id="inquiriesCard" style="display: none;">
            <h2>📥 Mga Bagong Aplikasyon / Inquiry</h2>
            <div id="inquiriesContainer"></div>
        </div>

        <!-- Add Store Form -->
        <div class="card" style="background: #f1f8e9; border: 1px solid #c5e1a5;">
            <h2>➕ Magdagdag ng Bagong Tindahan</h2>
            <form id="addStoreForm">
                <div class="form-group">
                    <label>Pangalan ng Tindahan:</label>
                    <input type="text" id="adminStoreName" placeholder="Hal. Aling Nena Store" required>
                </div>
                <div class="form-group">
                    <label>Pangalan ng May-ari:</label>
                    <input type="text" id="adminOwnerName" placeholder="Hal. Juan Dela Cruz">
                </div>
                <div class="form-group">
                    <label>Lokasyon / Address ng Tindahan:</label>
                    <input type="text" id="adminStoreAddress" placeholder="Hal. Brgy. Osiao, Sorsogon" required>
                </div>
                <div class="form-group">
                    <label>Numero ng Telepono / GCash:</label>
                    <input type="text" id="adminContact" placeholder="Hal. 09123456789">
                </div>
                <div class="form-group">
                    <label>Uri ng Walis (Style):</label>
                    <select id="adminStyleType">
                        <option value="Ordinary">Ordinary Style</option>
                        <option value="Premium">Premium Style</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Bilang ng Stock (Initial Qty):</label>
                    <input type="number" id="adminInitialQty" value="10" min="1" required>
                </div>
                <div class="form-group">
                    <label>Presyo bawat piraso (₱):</label>
                    <input type="number" id="adminPrice" value="100" min="1" required>
                </div>
                <div class="form-group">
                    <label>Target na Petsa ng Koleksyon:</label>
                    <input type="date" id="adminCollectionDate" required>
                </div>
                <button type="submit">Irehistro ang Tindahan at Mag-deploy</button>
            </form>
        </div>

        <!-- Stores List -->
        <div class="card">
            <h2>🏪 Listahan ng mga Aktibong Tindahan</h2>
            <div id="storesListContainer">
                <p style="font-size: 0.85rem; color: #666;">Kinukuha ang data...</p>
            </div>
        </div>
    </div>

    <!-- Firebase Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us",
          authDomain: "dwbe-consignment.firebaseapp.com",
          projectId: "dwbe-consignment",
          storageBucket: "dwbe-consignment.firebasestorage.app",
          messagingSenderId: "205759197252",
          appId: "1:205759197252:web:b04400821f81791d10cc11"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let appData = { homeStock: { Ordinary: 0, Premium: 0 }, consignments: [], pendingInquiries: [] };
        const syncStatus = document.getElementById('syncStatus');

        async function loadData() {
            syncStatus.textContent = "Kumukuha ng data sa Cloud...";
            try {
                const docRef = doc(db, "app_data", "main_inventory");
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    appData = docSnap.data();
                    if (!appData.homeStock) appData.homeStock = { Ordinary: 0, Premium: 0 };
                    if (!appData.consignments) appData.consignments = [];
                    if (!appData.pendingInquiries) appData.pendingInquiries = [];
                }
                syncStatus.textContent = "✅ Nakakonekta sa Cloud Database";
                renderAdminDashboard();
            } catch (err) {
                console.error("Error loading cloud data:", err);
                syncStatus.textContent = "⚠️ Nabigo sa pagkonekta sa Cloud.";
            }
        }

        async function saveData() {
            syncStatus.textContent = "Nagse-save sa Cloud...";
            try {
                await setDoc(doc(db, "app_data", "main_inventory"), appData);
                syncStatus.textContent = "✅ Na-save at Nakakonekta sa Cloud";
                renderAdminDashboard();
            } catch (err) {
                console.error("Error saving cloud data:", err);
                syncStatus.textContent = "⚠️ Error sa pag-save sa cloud";
            }
        }

        window.updateHomeStock = async function(style) {
            const inputId = style === 'Ordinary' ? 'addOrdinaryQty' : 'addPremiumQty';
            const qty = parseInt(document.getElementById(inputId).value);
            if (isNaN(qty) || qty <= 0) {
                alert("Ilagay ang tamang bilang.");
                return;
            }
            appData.homeStock[style] = (appData.homeStock[style] || 0) + qty;
            await saveData();
            alert(`Matagumpay na naidagdag ang ${qty} pcs sa ${style} bodega.`);
        };

        const addStoreForm = document.getElementById('addStoreForm');
        addStoreForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const storeName = document.getElementById('adminStoreName').value.trim();
            const ownerName = document.getElementById('adminOwnerName').value.trim();
            const address = document.getElementById('adminStoreAddress').value.trim();
            const contact = document.getElementById('adminContact').value.trim();
            const styleType = document.getElementById('adminStyleType').value;
            const initialQty = parseInt(document.getElementById('adminInitialQty').value);
            const price = parseFloat(document.getElementById('adminPrice').value);
            const collectionDate = document.getElementById('adminCollectionDate').value;

            if (!storeName || !address) {
                alert("Kailangan ang Pangalan at Address ng Tindahan.");
                return;
            }

            const existing = appData.consignments.find(c => c.storeName.toLowerCase() === storeName.toLowerCase());
            if (existing) {
                alert("Ang pangalan ng tindahang ito ay nakarehistro na!");
                return;
            }

            const newItem = {
                styleType: styleType,
                initialQty: initialQty,
                currentStock: initialQty,
                price: price,
                collectionDate: collectionDate
            };

            appData.consignments.push({
                storeName: storeName,
                ownerName: ownerName,
                address: address,
                contact: contact,
                storeItems: [newItem],
                clientNotifications: [{ text: `Na-rehistro ang iyong tindahan sa sistema. Address: ${address}`, date: new Date().toLocaleString() }],
                messages: []
            });

            await saveData();
            alert("Matagumpay na naidagdag ang bagong tindahan!");
            addStoreForm.reset();
        });

        window.approveInquiry = function(index) {
            const inq = appData.pendingInquiries[index];
            document.getElementById('adminStoreName').value = inq.storeName;
            document.getElementById('adminOwnerName').value = inq.ownerName || '';
            document.getElementById('adminStoreAddress').value = inq.address || '';
            document.getElementById('adminContact').value = inq.contact || '';
            document.getElementById('adminStyleType').value = inq.styleType || 'Ordinary';
            
            appData.pendingInquiries.splice(index, 1);
            saveData();
            window.scrollTo({ top: document.getElementById('addStoreForm').offsetTop - 50, behavior: 'smooth' });
        };

        window.deleteInquiry = async function(index) {
            if (confirm("Sigurado ka bang gusto mong burahin ang inquiry na ito?")) {
                appData.pendingInquiries.splice(index, 1);
                await saveData();
            }
        };

        window.updateStoreStock = async function(storeName, itemIndex) {
            const store = appData.consignments.find(c => c.storeName === storeName);
            if (!store || !store.storeItems[itemIndex]) return;

            const newStockStr = prompt(`Ilagay ang NATITIRANG stock para sa ${store.storeItems[itemIndex].styleType}:`, store.storeItems[itemIndex].currentStock);
            if (newStockStr === null) return;
            const newStock = parseInt(newStockStr);
            if (isNaN(newStock) || newStock < 0) {
                alert("Maling bilang ng stock.");
                return;
            }

            store.storeItems[itemIndex].currentStock = newStock;
            await saveData();
        };

        window.deleteStore = async function(storeName) {
            if (confirm(`Sigurado ka bang gusto mong tanggalin ang tindahang "${storeName}"?`)) {
                appData.consignments = appData.consignments.filter(c => c.storeName !== storeName);
                await saveData();
            }
        };

        function renderAdminDashboard() {
            document.getElementById('homeOrdinaryStock').textContent = appData.homeStock.Ordinary || 0;
            document.getElementById('homePremiumStock').textContent = appData.homeStock.Premium || 0;

            const inquiriesCard = document.getElementById('inquiriesCard');
            const inquiriesContainer = document.getElementById('inquiriesContainer');
            inquiriesContainer.innerHTML = '';
            if (appData.pendingInquiries && appData.pendingInquiries.length > 0) {
                inquiriesCard.style.display = 'block';
                appData.pendingInquiries.forEach((inq, index) => {
                    const div = document.createElement('div');
                    div.className = 'inquiry-box';
                    div.innerHTML = `
                        <strong>🏪 ${inq.storeName}</strong> (${inq.ownerName || 'Walang Pangalan'})<br>
                        📍 <strong>Address:</strong> ${inq.address || 'N/A'}<br>
                        📞 Contact: ${inq.contact || 'N/A'} | Email: ${inq.email || 'N/A'}<br>
                        🏷️ Style: ${inq.styleType} | Petsa: ${inq.date}<br>
                        ${inq.message ? `💬 Mensahe: "${inq.message}"<br>` : ''}
                        <div style="margin-top: 6px; display: flex; gap: 6px;">
                            <button type="button" onclick="approveInquiry(${index})" style="padding: 6px 10px; font-size: 0.85rem; width: auto; margin-top: 0;">Aprubahan</button>
                            <button type="button" onclick="deleteInquiry(${index})" style="background-color: #d32f2f; padding: 6px 10px; font-size: 0.85rem; width: auto; margin-top: 0;">Burahin</button>
                        </div>
                    `;
                    inquiriesContainer.appendChild(div);
                });
            } else {
                inquiriesCard.style.display = 'none';
            }

            const storesListContainer = document.getElementById('storesListContainer');
            storesListContainer.innerHTML = '';
            if (!appData.consignments || appData.consignments.length === 0) {
                storesListContainer.innerHTML = '<p style="font-size: 0.85rem; color: #666;">Wala pang rehistradong tindahan.</p>';
                return;
            }

            appData.consignments.forEach(store => {
                const isOnline = store.clientStatus === "Online";
                const div = document.createElement('div');
                div.className = 'store-item-box';
                
                let itemsHtml = '';
                if (store.storeItems) {
                    store.storeItems.forEach((item, idx) => {
                        const sold = Math.max(0, item.initialQty - item.currentStock - (item.rejectedQty || 0));
                        const sales = sold * item.price;
                        itemsHtml += `
                            <div style="margin-top: 6px; padding: 6px; background: #fff; border: 1px solid #eee; border-radius: 4px; font-size: 0.85rem;">
                                <strong>${item.styleType}</strong> — Presyo: ₱${item.price}<br>
                                Stock: ${item.currentStock} pcs / Simula: ${item.initialQty} pcs | Nabenta: <strong>${sold} pcs</strong> (₱${sales.toLocaleString()})<br>
                                Koleksyon: ${item.collectionDate || 'N/A'}
                                <div style="margin-top: 4px;">
                                    <button type="button" onclick="updateStoreStock('${store.storeName}', ${idx})" style="padding: 4px 8px; font-size: 0.75rem; width: auto; background-color: #0288d1; margin-top: 0;">I-update ang Stock</button>
                                </div>
                            </div>
                        `;
                    });
                }

                div.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 4px; margin-bottom: 6px;">
                        <div>
                            <strong style="color: #2e7d32;">${store.storeName}</strong> 
                            <span style="font-size: 0.75rem; color: #666;">(${store.ownerName || 'Walang May-ari'})</span>
                        </div>
                        <span class="badge ${isOnline ? 'online' : ''}">${isOnline ? 'Online' : 'Offline'}</span>
                    </div>
                    <div style="font-size: 0.85rem; color: #444; margin-bottom: 6px;">
                        📍 <strong>Address:</strong> ${store.address || 'Wala pang nailagay na address'}<br>
                        📞 Contact: ${store.contact || 'N/A'} | Huling Aksyon: ${store.lastClientAccess || 'Hindi pa nabubuksan'}
                    </div>
                    ${itemsHtml}
                    <div style="margin-top: 8px; text-align: right;">
                        <button type="button" onclick="deleteStore('${store.storeName}')" style="background-color: #d32f2f; padding: 4px 10px; font-size: 0.75rem; width: auto; margin-top: 0;">Tanggalin ang Tindahan</button>
                    </div>
                `;
                storesListContainer.appendChild(div);
            });
        }

        loadData();

        setInterval(() => {
            loadData();
        }, 15000);
    </script>
</body>
</html>
