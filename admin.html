<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Whisk Broom - Admin Panel</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <style>
        :root { --primary-color: #2e7d32; --secondary-color: #4caf50; --background-color: #f4f6f8; --text-color: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background-color); color: var(--text-color); padding-bottom: 70px; }
        header { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0px 2px 4px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { font-size: 1rem; margin-bottom: 10px; color: var(--primary-color); }
        input, select, textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        button { background-color: var(--secondary-color); color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; font-weight: bold; width: 100%; }
        button:hover { background-color: #388e3c; }
        
        .store-card { background: white; border-left: 5px solid #2e7d32; padding: 12px; border-radius: 6px; margin-bottom: 12px; box-shadow: 0px 1px 3px rgba(0,0,0,0.1); }
        .store-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 8px; font-size: 0.95rem; }
        .badge { background: #ffebee; color: #c62828; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
        .store-details { font-size: 0.85rem; color: #555; margin-bottom: 8px; }
        .btn-group { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
        .btn-group button { flex: 1; padding: 6px; font-size: 0.75rem; }
        .btn-danger { background-color: #d32f2f; }
        .btn-danger:hover { background-color: #b71c1c; }
        .btn-warning { background-color: #f57c00; }
        .btn-warning:hover { background-color: #e65100; }
        .btn-info { background-color: #0288d1; }
        .btn-info:hover { background-color: #01579b; }

        #syncStatus { text-align: center; font-size: 0.8rem; color: #666; margin-bottom: 10px; font-style: italic; }
    </style>
</head>
<body>

    <header>🧹 DWB Admin Panel (Cloud Sync)</header>

    <div class="container">
        <div id="syncStatus">Kumokonekta sa Cloud Database...</div>

        <div class="card">
            <h2>➕ Magdagdag ng Bagong Tindahan</h2>
            <form id="storeForm">
                <input type="text" id="storeName" placeholder="Pangalan ng Tindahan" required>
                <select id="styleType">
                    <option value="Ordinary">Ordinary - ₱140</option>
                    <option value="Special">Special - ₱150</option>
                </select>
                <input type="number" id="initialQty" placeholder="Simulang Stock (Pcs)" required>
                <input type="date" id="dateDelivered" required>
                <input type="date" id="collectionDate" required>
                <button type="submit">I-save ang Consignment</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 Listahan ng mga Tindahan</h2>
            <div id="storeList">Naa-access ang data mula sa cloud...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us",
          authDomain: "dwbe-consignment.firebaseapp.com",
          projectId: "dwbe-consignment",
          storageBucket: "dwbe-consignment.firebasestorage.app",
          messagingSenderId: "205759197252",
          appId: "1:205759197252:web:b04400821f81791d10cc11"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const syncStatus = document.getElementById('syncStatus');
        const storeListEl = document.getElementById('storeList');
        const storeForm = document.getElementById('storeForm');

        // Itakda ang default na petsa ngayon
        document.getElementById('dateDelivered').valueAsDate = new Date();

        async function loadStores() {
            syncStatus.textContent = "Kumukuha ng data sa Cloud...";
            try {
                const querySnapshot = await getDocs(collection(db, "consignments"));
                let consignments = [];
                querySnapshot.forEach((docSnap) => {
                    consignments.push(docSnap.data());
                });
                
                displayStores(consignments);
                syncStatus.textContent = "✅ Nakakonekta sa Cloud (Live Sync)";
            } catch (error) {
                console.error("Error loading:", error);
                syncStatus.textContent = "⚠️ Nabigo sa pagkonekta sa internet.";
            }
        }

        function displayStores(consignments) {
            storeListEl.innerHTML = '';
            if (consignments.length === 0) {
                storeListEl.innerHTML = '<div>Wala pang naka-save na tindahan.</div>';
                return;
            }

            consignments.forEach(item => {
                if (item.rejectedQty === undefined) item.rejectedQty = 0;
                const sold = Math.max(0, item.initialQty - item.currentStock - item.rejectedQty);
                const sales = sold * item.price;

                const card = document.createElement('div');
                card.className = 'store-card';
                card.innerHTML = `
                    <div class="store-header">
                        <span>🏪 ${item.storeName} (${item.styleType}) - ₱${item.price}</span>
                    </div>
                    <div class="store-details">
                        📦 Simula: <strong>${item.initialQty}</strong> | ✨ Natitira: <strong>${item.currentStock}</strong> | 🛒 Nabenta: <strong>${sold}</strong><br>
                        💰 Total Benta: <strong>₱${sales}</strong><br>
                        📅 Simula: ${item.dateDelivered} | 🎯 Koleksyon: ${item.collectionDate}
                    </div>
                    <div class="btn-group">
                        <button class="btn-info" onclick="openClientLink('${item.storeName}')">🔗 Client Link</button>
                        <button class="btn-warning" onclick="quickUpdate('${item.storeName}')">⚙️ Update Stock</button>
                        <button class="btn-danger" onclick="deleteStore('${item.storeName}')">🗑️ Burahin</button>
                    </div>
                `;
                storeListEl.appendChild(card);
            });
        }

        storeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const storeName = document.getElementById('storeName').value.trim();
            const styleType = document.getElementById('styleType').value;
            const initialQty = parseInt(document.getElementById('initialQty').value);
            const price = styleType === 'Special' ? 150 : 140;
            const dateDelivered = document.getElementById('dateDelivered').value;
            const collectionDate = document.getElementById('collectionDate').value;

            const newItem = {
                storeName,
                styleType,
                price,
                initialQty,
                currentStock: initialQty,
                rejectedQty: 0,
                dateDelivered,
                collectionDate,
                history: [{ date: new Date().toISOString().split('T')[0], text: `Nagsimula sa ${initialQty} pcs` }]
            };

            try {
                syncStatus.textContent = "Nagse-save sa Cloud...";
                await setDoc(doc(db, "consignments", storeName), newItem);
                storeForm.reset();
                document.getElementById('dateDelivered').valueAsDate = new Date();
                loadStores();
                alert("Matagumpay na nai-save sa cloud!");
            } catch (err) {
                console.error(err);
                alert("May error sa pag-save.");
            }
        });

        window.openClientLink = function(storeName) {
            const baseUrl = window.location.origin + window.location.pathname.replace('admin.html', '');
            const clientUrl = baseUrl + 'index.html?store=' + encodeURIComponent(storeName);
            prompt("Kopyahin ang Client Dashboard link:", clientUrl);
        };

        window.quickUpdate = async function(storeName) {
            const newStockStr = prompt(`Ilagay ang bagong NATITIRANG stock para kay ${storeName}:`);
            if (newStockStr === null) return;
            const newStock = parseInt(newStockStr);
            if (isNaN(newStock)) {
                alert("Maling numero ang nailagay.");
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "consignments"));
                let targetItem = null;
                querySnapshot.forEach(d => {
                    if(d.data().storeName === storeName) targetItem = d.data();
                });

                if(targetItem) {
                    targetItem.currentStock = newStock;
                    if(!targetItem.history) targetItem.history = [];
                    targetItem.history.push({
                        date: new Date().toISOString().split('T')[0],
                        text: `Nagbago ang natitirang stock sa ${newStock} pcs`
                    });
                    
                    await setDoc(doc(db, "consignments", storeName), targetItem);
                    loadStores();
                    alert("Na-update na ang stock!");
                }
            } catch (err) {
                console.error(err);
                alert("Hindi na-update.");
            }
        };

        window.deleteStore = async function(storeName) {
            if (confirm(`Sigurado ka bang burahin si ${storeName}?`)) {
                try {
                    await deleteDoc(doc(db, "consignments", storeName));
                    loadStores();
                    alert("Nabura na.");
                } catch (err) {
                    console.error(err);
                    alert("Hindi nabura.");
                }
            }
        };

        loadStores();
    </script>
</body>
</html>
