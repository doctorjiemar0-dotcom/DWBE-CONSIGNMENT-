<!DOCTYPE html>
<html lang="tl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Doctor's Whisk Broom - Admin Panel</title>
<meta name="theme-color" content="#185c38">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23185c38' width='32' height='32'/><text x='50%' y='50%' font-size='24' text-anchor='middle' dominant-baseline='central'>🧹</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Tahoma,Verdana,sans-serif}
body{background:#f3f6f4;color:#333;padding-bottom:60px;line-height:1.45}
header{position:sticky;top:0;z-index:50;background:linear-gradient(115deg,#12452b,#2d8050);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:1.05rem}
.wrap{max-width:900px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #e1e9e3;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 4px 14px rgba(22,55,35,.06)}
h2{font-size:1rem;color:#1a5837;margin-bottom:8px}
label{display:block;font-size:.78rem;font-weight:700;margin:6px 0 3px;color:#31473a}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid #cfdcd3;border-radius:9px;font-size:.9rem;min-height:40px}
button{background:#287a4b;color:#fff;border:0;border-radius:9px;padding:9px 12px;font-weight:700;font-size:.85rem;cursor:pointer;min-height:38px}
button.red{background:#c62828}button.gray{background:#607d8b}button.blue{background:#0277bd}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1;min-width:110px}
.row>button{flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;background:#fff;border-bottom:1px solid #dde6df;position:sticky;top:52px;z-index:40}
.tabs button{background:#e8f0ea;color:#185c38;white-space:nowrap}
.tabs button.on{background:#185c38;color:#fff}
.bd{background:#d32f2f;color:#fff;border-radius:99px;padding:0 6px;font-size:.7rem;margin-left:4px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:700;background:#e8f0ea;color:#3d5a48}
.ok{background:#e3f4e8;color:#1b6b38}.bad{background:#fde8e8;color:#b3261e}.warn{background:#fff1d6;color:#a35a00}
.muted{color:#6b7c71;font-size:.8rem}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.imgs img{width:100%;height:150px;object-fit:cover;border-radius:8px;background:#eee;cursor:pointer}
.imgs small{display:block;text-align:center;font-size:.7rem;color:#666}
.rec{border-left:4px solid #2e7d32;background:#f8fbf8;padding:8px 10px;border-radius:8px;margin:6px 0;font-size:.84rem}
.rec.a{border-color:#1976d2;background:#eef6ff}
.rec .d{font-size:.7rem;color:#778;text-align:right}
#login{max-width:420px;margin:40px auto}
#app{display:none}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;align-items:center;justify-content:center}
#modal img{max-width:94%;max-height:90%;border-radius:8px}
.sub{border-top:1px dashed #cfdcd3;margin-top:8px;padding-top:8px}
</style>
</head>
<body>
<header><b>🧹 DWBE Admin Panel</b><span class="row" style="flex:0 0 auto;gap:6px"><span id="modeTag" class="pill warn" style="display:none">TEST MODE</span><span id="sync" class="muted" style="color:#d6e9db">…</span><button id="outBtn" class="gray" style="display:none" onclick="logout()">Logout</button></span></header>

<div id="login" class="card">
  <h2>🔐 Admin Login</h2>
  <label>Admin Email</label><input type="email" id="lEmail" autocomplete="username">
  <label>Password</label><input type="password" id="lPass" autocomplete="current-password">
  <button style="width:100%;margin-top:10px" onclick="login()">Mag-login</button>
  <p class="muted" style="margin-top:8px"><a href="Inodex.html">← Bumalik sa Client Portal</a></p>
</div>

<div id="app">
  <div class="tabs" id="tabs"></div>
  <div class="wrap" id="view"></div>
</div>
<div id="modal" onclick="this.style.display='none'"><img id="modalImg"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { getAuth, signOut, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

const app = initializeApp({
  apiKey: "AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us",
  authDomain: "dwbe-consignment.firebaseapp.com",
  projectId: "dwbe-consignment",
  storageBucket: "dwbe-consignment.firebasestorage.app",
  messagingSenderId: "205759197252",
  appId: "1:205759197252:web:b04400821f81791d10cc11"
}, "admin");
const auth = getAuth(app), db = getFirestore(app), storage = getStorage(app);

// TESTING MODE (parehong key ng client)
const qp = new URLSearchParams(location.search);
if (qp.get('test') === '1') localStorage.setItem('dwbe_test_mode', '1');
if (qp.get('test') === '0') localStorage.removeItem('dwbe_test_mode');
const TEST = localStorage.getItem('dwbe_test_mode') === '1';
const DATA_DOC = TEST ? 'test_inventory' : 'main_inventory';
if (TEST) $('modeTag').style.display = '';

// Parehong format at constants ng client
const PAY_TERMS = { monthly:'Buwanan (End of Month)', semimonthly:'Kada 15 Araw', weekly:'Lingguhan', sellout:'Pagkaubos ng Stock' };
const STD = { Ordinary: 150, Premium: 160 };
const now = () => new Date().toLocaleString('en-PH', { year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', hour12:true });
const stamp = () => ({ date: now(), ts: Date.now() });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const recTs = r => typeof r?.ts === 'number' ? r.ts : (isNaN(Date.parse(r?.date)) ? 0 : Date.parse(r.date));
const newest = l => (l || []).map((x,i)=>({x,i})).sort((a,b)=>(recTs(b.x)-recTs(a.x))||(a.i-b.i));
const monthKey = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
function $(id){ return document.getElementById(id); }

function addTx(s, type, text){ (s.transactionHistory ||= []).unshift(Object.assign({type,text}, stamp())); }
function notify(s, text){ (s.clientNotifications ||= []).unshift(Object.assign({text}, stamp())); }

let D = { homeStock:{Ordinary:0,Premium:0}, consignments:[], pendingInquiries:[] };
let tab = 'apps', unsub = null, loaded = false;
const urlCache = {};

// ===== AUTH =====
window.login = async () => {
  try { await signInWithEmailAndPassword(auth, $('lEmail').value.trim(), $('lPass').value); }
  catch (e) { alert('⚠️ Hindi nakapag-login: ' + e.message); }
};
window.logout = () => signOut(auth);
onAuthStateChanged(auth, u => {
  $('login').style.display = u ? 'none' : '';
  $('app').style.display = u ? 'block' : 'none';
  $('outBtn').style.display = u ? '' : 'none';
  if (u) listen(); else { if (unsub) unsub(); unsub = null; loaded = false; }
});

// ===== DATA =====
function listen(){
  if (unsub) unsub();
  $('sync').textContent = 'Kumukonekta…';
  unsub = onSnapshot(doc(db, 'app_data', DATA_DOC), snap => {
    if (snap.metadata.hasPendingWrites) return;
    if (snap.exists()) D = snap.data();
    D.homeStock ||= {Ordinary:0,Premium:0}; D.consignments ||= []; D.pendingInquiries ||= [];
    loaded = true; $('sync').textContent = '✅ Online'; render();
  }, err => { console.error(err); $('sync').textContent = '⚠️ Error'; alert('Hindi mabasa ang database: ' + err.message); });
}
async function save(){
  $('sync').textContent = 'Nagse-save…';
  try { await setDoc(doc(db, 'app_data', DATA_DOC), D); $('sync').textContent = '✅ Na-save'; }
  catch (e) { console.error(e); $('sync').textContent = '⚠️ Error'; alert('Error sa pag-save: ' + e.message); }
  render();
}

// ===== LARAWAN =====
async function loadImgs(){
  document.querySelectorAll('img[data-p]').forEach(async im => {
    const p = im.dataset.p; if (!p || p === 'TEST') return;
    try { urlCache[p] ||= await getDownloadURL(ref(storage, p)); im.src = urlCache[p]; }
    catch (e) { im.alt = 'Hindi ma-load'; im.title = e.code || e.message; }
  });
}
window.zoom = el => { if (!el.src) return; $('modalImg').src = el.src; $('modal').style.display = 'flex'; };

// ===== RENDER =====
const sales = () => D.consignments.flatMap((s,si)=>(s.pendingSales||[]).map((x,pi)=>({s,si,x,pi})));
const reqs  = () => D.consignments.flatMap((s,si)=>(s.activeRequests||[]).map((x,ri)=>({s,si,x,ri})));
function render(){
  if (!loaded) return;
  const T = [['apps','📝 Aplikasyon',D.pendingInquiries.length],['rest','📦 Restock',reqs().length],['sales','💰 Benta',sales().length],['stores','🏪 Tindahan',0],['chat','💬 Chat',0],['stock','🏭 Stock',0]];
  $('tabs').innerHTML = T.map(([k,l,n]) => `<button class="${tab===k?'on':''}" onclick="go('${k}')">${l}${n?`<span class="bd">${n}</span>`:''}</button>`).join('');
  $('view').innerHTML = ({apps:vApps, rest:vRest, sales:vSales, stores:vStores, chat:vChat, stock:vStock})[tab]();
  loadImgs();
}
window.go = t => { tab = t; render(); window.scrollTo(0,0); };
const empty = t => `<div class="card muted">${t}</div>`;
const termSel = (id, v) => `<select id="${id}">${Object.entries(PAY_TERMS).map(([k,l])=>`<option value="${k}" ${k===(v||'monthly')?'selected':''}>${l}</option>`).join('')}</select>`;

// --- Aplikasyon ---
function vApps(){
  if (!D.pendingInquiries.length) return empty('Walang pending na aplikasyon.');
  return newest(D.pendingInquiries).map(({x:q,i}) => `<div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(q.storeName)}</h2><span class="pill warn">Pending</span></div>
    <div class="muted">${esc(q.date)}</div>
    <p style="margin-top:6px;font-size:.88rem">👤 ${esc(q.ownerName)} · 📞 ${esc(q.contact)}<br>✉️ ${esc(q.email)}<br>📍 ${esc(q.address)}<br>🧹 <b>${esc(q.styleType)}</b> × ${esc(q.initialQty||5)} pcs${q.message?`<br>💬 ${esc(q.message)}`:''}</p>
    <div class="imgs">
      <div><img data-p="${esc(q.idPath)}" onclick="zoom(this)"><small>Valid ID${q.idPath==='TEST'?' (TEST)':''}</small></div>
      <div><img data-p="${esc(q.storePath)}" onclick="zoom(this)"><small>Store Front${q.storePath==='TEST'?' (TEST)':''}</small></div>
    </div>
    <div class="row"><div><label>Presyo/piraso (₱)</label><input type="number" id="apP${i}" value="${STD[q.styleType]||150}"></div>
    <div><label>Terms ng bayad</label>${termSel('apT'+i)}</div></div>
    <div class="row" style="margin-top:10px"><button onclick="approveApp(${i})">✅ I-approve</button><button class="red" onclick="rejectApp(${i})">❌ Tanggihan</button></div>
  </div>`).join('');
}
window.approveApp = async i => {
  const q = D.pendingInquiries[i]; if (!q) return;
  const em = (q.email||'').trim().toLowerCase();
  if (D.consignments.some(c => (c.email||'').trim().toLowerCase() === em)) { alert('May tindahan nang gumagamit ng email na ito.'); return; }
  const price = Number($('apP'+i).value) || STD[q.styleType] || 0, qty = Number(q.initialQty) || 5;
  if ((D.homeStock[q.styleType]||0) < qty && !confirm(`Kulang ang home stock (${D.homeStock[q.styleType]||0} pcs ng ${q.styleType}). Ituloy pa rin?`)) return;
  const today = new Date().toISOString().slice(0,10);
  const s = { storeName:q.storeName, ownerName:q.ownerName, contact:q.contact, email:em, address:q.address,
    styleType:q.styleType, initialQty:qty, currentStock:qty, returnedQty:0, rejectedQty:0, price, collectionDate:today,
    storeItems:[{ styleType:q.styleType, initialQty:qty, currentStock:qty, returnedQty:0, rejectedQty:0, price, collectionDate:today }],
    paymentTerms:$('apT'+i).value, consignmentStatus:'Aktibo ang Consignment', agreementAccepted:false, mustChangePassword:false,
    idPath:q.idPath||'', storePath:q.storePath||'', messages:[], transactionHistory:[], clientNotifications:[], activeRequests:[], approvedRestocks:[], restockLog:[], pendingSales:[], discounts:[] };
  addTx(s, 'Kasunduan', `Na-approve ang aplikasyon: ${qty} pcs (${q.styleType}) sa ₱${price}`);
  notify(s, `Na-approve ang iyong aplikasyon! ${qty} pcs ng ${q.styleType} sa ₱${price} bawat piraso.`);
  D.homeStock[q.styleType] = Math.max(0, (D.homeStock[q.styleType]||0) - qty);
  D.consignments.push(s); D.pendingInquiries.splice(i,1); await save();
  alert('Na-approve. Makaka-login na ang tindahan gamit ang email at password na ginawa niya.');
};
window.rejectApp = async i => {
  const q = D.pendingInquiries[i]; if (!q || !confirm(`Tanggihan ang aplikasyon ng ${q.storeName}?`)) return;
  D.pendingInquiries.splice(i,1); await save();
  alert('Inalis ang aplikasyon. (Nananatili ang Firebase account at mga larawan; burahin sa Firebase Console kung kailangan.)');
};

// --- Restock ---
function vRest(){
  const L = reqs(); if (!L.length) return empty('Walang pending na restock request.');
  return newest(L.map(o=>Object.assign({},o.x,{_o:o}))).map(({x}) => { const o = x._o; return `<div class="card">
    <h2>${esc(o.s.storeName)}</h2><div class="muted">${esc(o.x.date)}</div>
    <p style="margin:6px 0"><b>${esc(o.x.styleType)}</b> × ${esc(o.x.qty)} pcs · Home stock: ${D.homeStock[o.x.styleType]||0}</p>
    <label>Presyo/piraso (₱)</label><input type="number" id="rp${o.si}_${o.ri}" value="${(o.s.storeItems||[]).find(i=>i.styleType===o.x.styleType)?.price||STD[o.x.styleType]||0}">
    <div class="row" style="margin-top:8px"><button onclick="appRest(${o.si},${o.ri})">✅ I-approve</button><button class="red" onclick="rejRest(${o.si},${o.ri})">❌ Tanggihan</button></div></div>`; }).join('');
}
window.appRest = async (si, ri) => {
  const s = D.consignments[si], r = s?.activeRequests?.[ri]; if (!r) return;
  const price = Number($(`rp${si}_${ri}`).value) || STD[r.styleType] || 0;
  (s.approvedRestocks ||= []).push(Object.assign({ reqId:r.id, styleType:r.styleType, qty:r.qty, price }, stamp()));
  s.activeRequests.splice(ri,1);
  const lg = (s.restockLog||[]).find(x => x.id === r.id); if (lg) { lg.status='Approved'; lg.updatedAt=now(); lg.updatedTs=Date.now(); }
  addTx(s,'Restock',`Na-approve ang restock: ${r.qty} pcs (${r.styleType}) sa ₱${price}`);
  notify(s,`Na-approve ang restock mo: ${r.qty} pcs ng ${r.styleType} sa ₱${price}. Pindutin ang "Natanggap Ko Na" kapag dumating na.`);
  await save();
};
window.rejRest = async (si, ri) => {
  const s = D.consignments[si], r = s?.activeRequests?.[ri]; if (!r) return;
  const reason = prompt('Dahilan ng pagtanggi (opsyonal):'); if (reason === null) return;
  s.activeRequests.splice(ri,1);
  const lg = (s.restockLog||[]).find(x => x.id === r.id); if (lg) { lg.status='Rejected'; lg.reason=reason; lg.updatedAt=now(); lg.updatedTs=Date.now(); }
  addTx(s,'Restock',`Tinanggihan ang restock: ${r.qty} pcs (${r.styleType})`);
  notify(s,`Tinanggihan ang restock request mo (${r.styleType})${reason?': '+reason:'.'}`);
  await save();
};

// --- Benta ---
function vSales(){
  const L = sales(); if (!L.length) return empty('Walang pending na benta.');
  const by = {}; L.forEach(o => (by[o.si] ||= []).push(o));
  return Object.entries(by).map(([si,arr]) => { const s = D.consignments[si];
    const tot = arr.reduce((t,o)=>t+(Number(o.x.totalAmount)||0),0);
    return `<div class="card"><h2>${esc(s.storeName)} <span class="pill warn">${arr.length} pending</span></h2>
    <p><b>Kabuuang babayaran: ₱${tot.toLocaleString('en-PH')}</b> <span class="muted">(${PAY_TERMS[s.paymentTerms]||PAY_TERMS.monthly})</span></p>
    ${newest(arr.map(o=>o.x)).map(({x,i}) => `<div class="rec">${esc(x.styleType)} × ${esc(x.qty)} @ ₱${esc(x.price)} = <b>₱${esc(x.totalAmount)}</b>${x.discountOff>0?` <span class="muted">(discount ₱${x.discountOff}/pc)</span>`:''}<div class="d">${esc(x.date)}</div></div>`).join('')}
    <button style="margin-top:8px;width:100%" onclick="payStore(${si})">💵 Natanggap ang Bayad (₱${tot.toLocaleString('en-PH')})</button></div>`; }).join('');
}
window.payStore = async si => {
  const s = D.consignments[si]; if (!s?.pendingSales?.length) return;
  const tot = s.pendingSales.reduce((t,x)=>t+(Number(x.totalAmount)||0),0), n = s.pendingSales.length;
  if (!confirm(`Kumpirmahin na natanggap ang ₱${tot} mula sa ${s.storeName}?`)) return;
  s.pendingSales = [];
  addTx(s,'Bayad',`Natanggap ng Admin ang bayad: ₱${tot} (${n} benta)`);
  notify(s,`Natanggap na ang bayad mo na ₱${tot}. Salamat!`);
  await save();
};

// --- Tindahan ---
function vStores(){
  if (!D.consignments.length) return empty('Wala pang tindahan.');
  return D.consignments.map((s,si) => {
    const online = Date.now() - (typeof s.lastClientAccess==='number'?s.lastClientAccess:Date.parse(s.lastClientAccess||'')||0) < 10*60*1000;
    const active = s.consignmentStatus !== 'Stopped';
    return `<div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(s.storeName)}</h2><span><span class="pill ${online?'ok':''}">${online?'Online':'Offline'}</span> <span class="pill ${active?'ok':'bad'}">${esc(s.consignmentStatus||'Aktibo')}</span></span></div>
    <p class="muted">👤 ${esc(s.ownerName)} · 📞 ${esc(s.contact)} · ✉️ ${esc(s.email)}<br>📍 ${esc(s.address)}</p>
    ${(s.storeItems||[]).map(i=>`<div class="rec">${esc(i.styleType)} — Stock: <b>${i.currentStock}</b> / ${i.initialQty} · Presyo: ₱${i.price||0} · Return: ${i.returnedQty||0} · Reject: ${i.rejectedQty||0}</div>`).join('')}
    <div class="row sub"><div><label>Terms ng bayad</label>${termSel('pt'+si, s.paymentTerms)}</div><button onclick="setTerms(${si})">I-save</button></div>
    <div class="row"><button class="blue" onclick="adjStock(${si})">✏️ Ayusin ang Stock</button><button class="gray" onclick="toggleStatus(${si})">${active?'⏸ Itigil':'▶️ I-activate'}</button><button class="red" onclick="delStore(${si})">🗑 Burahin</button></div>
    <div class="sub"><b style="font-size:.85rem">🏷 Discount</b>
      ${(s.discounts||[]).map((d,di)=>`<div class="rec">${esc(d.styleType)}: ${d.type==='percent'?d.value+'%':'₱'+d.value} (${esc(d.startDate||'—')} → ${esc(d.endDate||'—')}) <button class="red" style="min-height:0;padding:2px 8px;float:right" onclick="delDisc(${si},${di})">✕</button></div>`).join('')}
      <div class="row"><select id="ds${si}"><option>All</option><option>Ordinary</option><option>Premium</option></select><select id="dt${si}"><option value="amount">₱ halaga</option><option value="percent">% porsyento</option></select><input type="number" id="dv${si}" placeholder="Halaga"></div>
      <div class="row"><input type="date" id="d1${si}"><input type="date" id="d2${si}"><button onclick="addDisc(${si})">+ Idagdag</button></div></div>
    <div class="sub"><div class="row"><input id="nt${si}" placeholder="Abiso para sa tindahan…"><button onclick="sendNotif(${si})">📢 Ipadala</button></div></div>
    <details class="sub"><summary style="cursor:pointer;font-size:.85rem;font-weight:700">🧾 Kasaysayan ng Transaksyon</summary>
      ${newest(s.transactionHistory).slice(0,15).map(({x})=>`<div class="rec">[${esc(x.type)}] ${esc(x.text)}<div class="d">${esc(x.date)}</div></div>`).join('')||'<p class="muted">Wala pa.</p>'}</details>
  </div>`; }).join('');
}
window.setTerms = async si => { D.consignments[si].paymentTerms = $('pt'+si).value; await save(); };
window.toggleStatus = async si => {
  const s = D.consignments[si]; const stop = s.consignmentStatus !== 'Stopped';
  s.consignmentStatus = stop ? 'Stopped' : 'Aktibo ang Consignment'; if (stop) s.agreementAccepted = false;
  addTx(s,'Kasunduan', stop ? 'Itinigil ng Admin ang Consignment.' : 'Ini-activate ng Admin ang Consignment.'); await save();
};
window.delStore = async si => {
  const s = D.consignments[si]; if (!confirm(`BURAHIN ang ${s.storeName}? Hindi na ito mababawi.`)) return;
  D.consignments.splice(si,1); await save();
};
window.adjStock = async si => {
  const s = D.consignments[si]; if (!s.storeItems?.length) return;
  const st = s.storeItems.length > 1 ? prompt('Anong uri? (' + s.storeItems.map(i=>i.styleType).join(' / ') + ')') : s.storeItems[0].styleType; if (!st) return;
  const it = s.storeItems.find(i=>i.styleType===st); if (!it) return alert('Walang ganitong uri.');
  const v = prompt(`Bagong Current Stock ng ${st} (ngayon: ${it.currentStock}):`); if (v === null) return;
  const n = parseInt(v); if (isNaN(n) || n < 0) return alert('Hindi wastong bilang.');
  const old = it.currentStock; it.currentStock = n; addTx(s,'Stock',`Inayos ng Admin ang stock ng ${st}: ${old} → ${n} pcs`); await save();
};
window.addDisc = async si => {
  const v = Number($('dv'+si).value); if (!v || v <= 0) return alert('Maglagay ng halaga.');
  (D.consignments[si].discounts ||= []).push({ styleType:$('ds'+si).value, type:$('dt'+si).value, value:v, startDate:$('d1'+si).value||'', endDate:$('d2'+si).value||'' });
  await save();
};
window.delDisc = async (si,di) => { D.consignments[si].discounts.splice(di,1); await save(); };
window.sendNotif = async si => { const t = $('nt'+si).value.trim(); if (!t) return; notify(D.consignments[si], t); await save(); };

// --- Chat ---
function vChat(){
  const L = D.consignments.map((s,si)=>({s,si})).filter(o=>(o.s.messages||[]).length);
  if (!L.length) return empty('Walang mensahe.');
  return L.sort((a,b)=>recTs((b.s.messages||[])[0])-recTs((a.s.messages||[])[0])).map(({s,si}) => `<div class="card"><h2>${esc(s.storeName)}</h2>
    ${newest(s.messages).slice(0,8).map(({x})=>{ const ad=String(x.sender||'').includes('Admin'); return `<div class="rec ${ad?'a':''}"><b>${ad?'Admin':esc(x.sender)}</b>: ${esc(x.text)}<div class="d">${esc(x.date)}</div></div>`; }).join('')}
    <div class="row"><input id="cm${si}" placeholder="Sagot…"><button onclick="reply(${si})">Ipadala</button></div></div>`).join('');
}
window.reply = async si => {
  const t = $('cm'+si).value.trim(); if (!t) return;
  (D.consignments[si].messages ||= []).unshift(Object.assign({ sender:'Admin', text:t, kind:'chat' }, stamp())); await save();
};

// --- Home Stock ---
function vStock(){
  return `<div class="card"><h2>🏭 Home Stock (Supplier)</h2>
    <div class="row"><div><label>Ordinary</label><input type="number" id="hs0" value="${D.homeStock.Ordinary||0}"></div><div><label>Premium</label><input type="number" id="hs1" value="${D.homeStock.Premium||0}"></div><button onclick="saveHS()">I-save</button></div>
    <p class="muted" style="margin-top:8px">Nababawasan ito kapag nag-approve ka ng aplikasyon at kapag natanggap ng client ang restock.</p></div>
  <div class="card"><h2>⚙️ Database</h2><p class="muted">Gamit ngayon: <b>${DATA_DOC}</b><br>Para lumipat: idagdag ang <code>?test=1</code> (test) o <code>?test=0</code> (live) sa URL.</p></div>`;
}
window.saveHS = async () => { D.homeStock = { Ordinary: Math.max(0,parseInt($('hs0').value)||0), Premium: Math.max(0,parseInt($('hs1').value)||0) }; await save(); };
</script>
</body>
</html>
