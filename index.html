<script>
    let consignments = JSON.parse(localStorage.getItem('consignments_v2')) || [];

    // Set default date to today
    document.getElementById('dateDelivered').valueAsDate = new Date();
    let nextMonth = new Date();
    nextMonth.setMonth(nextMonth.getMonth() + 1);
    document.getElementById('collectionDate').valueAsDate = nextMonth;

    const form = document.getElementById('consignmentForm');
    const storesList = document.getElementById('storesList');

    function saveAndRender() {
        localStorage.setItem('consignments_v2', JSON.stringify(consignments));
        renderApp();
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        const sName = document.getElementById('storeName').value;
        const qty = parseInt(document.getElementById('quantity').value);
        const price = parseFloat(document.getElementById('price').value);
        const startD = document.getElementById('dateDelivered').value;
        const collD = document.getElementById('collectionDate').value;

        const newItem = {
            id: Date.now(),
            storeName: sName,
            initialQty: qty,
            currentStock: qty,
            rejectedQty: 0,
            price: price,
            dateDelivered: startD,
            collectionDate: collD,
            expanded: true,
            history: [
                { type: 'start', qty: qty, date: new Date().toLocaleString(), text: `Nag-simula ng Consignment: ${qty} pcs (Start: ${startD})` }
            ]
        };
        consignments.push(newItem);
        form.reset();
        document.getElementById('dateDelivered').valueAsDate = new Date();
        document.getElementById('collectionDate').valueAsDate = nextMonth;
        saveAndRender();
    });

    function renderApp() {
        storesList.innerHTML = '';
        if (consignments.length === 0) {
            storesList.innerHTML = '<p style="text-align:center; color:#778; font-size:0.9rem;">Wala pang naka-record na consignment.</p>';
            document.getElementById('totalStores').textContent = '0';
            document.getElementById('totalDue').textContent = '0';
            document.getElementById('totalStock').textContent = '0 pcs';
            document.getElementById('totalSold').textContent = '0 pcs';
            document.getElementById('totalSales').textContent = '₱0';
            return;
        }

        let tStores = consignments.length;
        let tDue = 0;
        let tStock = 0;
        let tSold = 0;
        let tSales = 0;

        const currentYM = new Date().toISOString().slice(0, 7);

        consignments.forEach((item, index) => {
            if (item.rejectedQty === undefined) item.rejectedQty = 0;

            const sold = item.initialQty - item.currentStock - item.rejectedQty;
            const actualSold = sold < 0 ? 0 : sold;
            const sales = actualSold * item.price;
            
            tStock += item.currentStock;
            tSold += actualSold;
            tSales += sales;

            const isDue = item.collectionDate && item.collectionDate.startsWith(currentYM);
            if (isDue) tDue++;

            let rating = 'Maayos';
            let badgeClass = 'badge-good';
            if (actualSold === 0 && item.initialQty > 0) { rating = 'Mabagal'; badgeClass = 'badge-ok'; }
            if (isDue) { rating = 'Due Na!'; badgeClass = 'badge-due'; }

            const div = document.createElement('div');
            div.className = `store-card ${isDue ? 'due' : ''}`;
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <strong>🏪 ${item.storeName}</strong>
                    <div>
                        <span class="badge ${badgeClass}">${rating}</span>
                        <button onclick="toggleCard(${index})" style="padding:2px 6px; font-size:0.75rem; background:#6c757d; width:auto; margin-top:0; display:inline-block;">${item.expanded ? 'Itago' : 'Ipakita'}</button>
                    </div>
                </div>
                
                <div class="highlight-box">
                    <span>📦 Simula: <strong>${item.initialQty} pcs</strong></span>
                    <span style="color: #2e7d32;">✨ Natitira: <strong>${item.currentStock} pcs</strong></span>
                    <span style="color: #c2185b;">🛒 Nabenta: <strong>${actualSold} pcs</strong></span>
                </div>
                ${item.rejectedQty > 0 ? `<div style="font-size: 0.8rem; color: #d32f2f; margin-bottom: 5px; font-weight: bold;">⚠️ Rejected / Sirang Items: ${item.rejectedQty} pcs</div>` : ''}
                
                <div style="display: ${item.expanded ? 'block' : 'none'}; margin-top: 8px;">
                    <div class="highlight-start">
                        <span>📅 Start of Consignment: ${item.dateDelivered}</span>
                        <button onclick="editDate(${index}, 'dateDelivered')" style="background:none; color:#0d47a1; border:none; cursor:pointer; font-size:0.75rem; width:auto; padding:0; margin:0; text-decoration:underline;">✏️ Baguhin</button>
                    </div>
                    <div class="highlight-due">
                        <span>🎯 Target Collection Date: ${item.collectionDate} ${isDue ? '<b>(Due Na!)</b>' : ''}</span>
                        <button onclick="editDate(${index}, 'collectionDate')" style="background:none; color:#b71c1c; border:none; cursor:pointer; font-size:0.75rem; width:auto; padding:0; margin:0; text-decoration:underline;">✏️ Baguhin</button>
                    </div>

                    <div style="font-size: 0.85rem; background: #f1f3f5; padding: 6px; border-radius: 4px; margin-bottom: 8px;">
                        Presyo: ₱${item.price} / isa | Total Halaga ng Natitira: <strong>₱${item.currentStock * item.price}</strong>
                    </div>
                    
                    <div class="history-box">
                        <strong>Kasaysayan (Transaction History):</strong>
                        ${item.history.map((h, hIdx) => `
                            <div class="history-row">
                                <span style="flex: 1; word-break: break-word;">[${h.date}] ${h.text}</span>
                                <div style="display: flex; gap: 4px; flex-shrink: 0;">
                                    <button onclick="editHistoryDate(${index}, ${hIdx})" title="Baguhin ang Petsa" style="background:none; color:#0288d1; border:none; cursor:pointer; font-size:0.75rem; width:auto; padding:0; margin:0;">✏️</button>
                                    <button onclick="deleteHistory(${index}, ${hIdx})" title="Burahin" style="background:none; color:red; border:none; cursor:pointer; font-size:0.75rem; width:auto; padding:0; margin:0;">❌</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="btn-group">
                        <button onclick="checkupStore(${index})" style="background-color: #0288d1;">Koleksyon (Check-up)</button>
                        <button onclick="bawasStock(${index})" style="background-color: #ff9800;">Bawas (Rejected)</button>
                        <button onclick="restockStore(${index})" style="background-color: #388e3c;">Restock</button>
                        <button onclick="printStore(${index})" style="background-color: #555;">Print</button>
                        <button onclick="deleteStore(${index})" style="background-color: #d32f2f;">Burahin</button>
                    </div>
                </div>
            `;
            storesList.appendChild(div);
        });

        document.getElementById('totalStores').textContent = tStores;
        document.getElementById('totalDue').textContent = tDue;
        document.getElementById('totalStock').textContent = tStock + ' pcs';
        document.getElementById('totalSold').textContent = tSold + ' pcs';
        document.getElementById('totalSales').textContent = '₱' + tSales.toLocaleString();
    }

    window.toggleCard = function(index) {
        consignments[index].expanded = !consignments[index].expanded;
        saveAndRender();
    };

    window.toggleAll = function(status) {
        consignments.forEach(item => item.expanded = status);
        saveAndRender();
    };

    window.editDate = function(index, field) {
        const currentVal = consignments[index][field];
        const newVal = prompt(`Baguhin ang ${field === 'dateDelivered' ? 'Start of Consignment' : 'Target Collection Date'} (Format: YYYY-MM-DD):`, currentVal);
        if (newVal) {
            consignments[index][field] = newVal;
            consignments[index].history.unshift({
                type: 'info',
                date: new Date().toLocaleString(),
                text: `Binago ang ${field === 'dateDelivered' ? 'Start Date' : 'Collection Date'} sa ${newVal}`
            });
            saveAndRender();
        }
    };

    window.editHistoryDate = function(storeIdx, histIdx) {
        const currentLog = consignments[storeIdx].history[histIdx];
        const newDateText = prompt('I-edit ang petsa o oras ng transaksyong ito:', currentLog.date);
        if (newDateText !== null) {
            consignments[storeIdx].history[histIdx].date = newDateText;
            saveAndRender();
        }
    };

    window.checkupStore = function(index) {
        const soldCount = prompt('Ilang piraso ang totoong nabenta o nakolekta sa check-up na ito?', '1');
        if (soldCount !== null && !isNaN(soldCount)) {
            const count = parseInt(soldCount);
            if (count > consignments[index].currentStock) {
                alert('Higit pa sa kasalukuyang natitirang stock ang inilagay mo.');
                return;
            }
            consignments[index].currentStock -= count;
            consignments[index].history.unshift({
                type: 'checkup',
                qty: count,
                date: new Date().toLocaleString(),
                text: `Koleksyon Check-up - Nabenta: ${count} pcs (Koleksyon: ₱${count * consignments[index].price})`
            });
            saveAndRender();
        }
    };

    window.bawasStock = function(index) {
        const bawasCount = prompt('Ilang piraso ang ibabawas (Rejected / Sirang items / Pull-out)?', '1');
        if (bawasCount !== null && !isNaN(bawasCount)) {
            const count = parseInt(bawasCount);
            if (count > consignments[index].currentStock) {
                alert('Hindi maaaring lumampas sa kasalukuyang natitirang stock ang ibabawas.');
                return;
            }
            consignments[index].currentStock -= count;
            consignments[index].rejectedQty = (consignments[index].rejectedQty || 0) + count;
            consignments[index].history.unshift({
                type: 'reject',
                qty: count,
                date: new Date().toLocaleString(),
                text: `Nagbawas ng ${count} pc(s) stock (Rejected / Sirang Item)`
            });
            saveAndRender();
        }
    };

    window.restockStore = function(index) {
        const addQty = prompt('Ilang bagong stock ang idadagdag?', '10');
        if (addQty !== null && !isNaN(addQty)) {
            const count = parseInt(addQty);
            consignments[index].initialQty += count;
            consignments[index].currentStock += count;
            consignments[index].history.unshift({
                type: 'restock',
                qty: count,
                date: new Date().toLocaleString(),
                text: `Nag-restock ng +${count} pcs (Bagong Initial: ${consignments[index].initialQty})`
            });
            saveAndRender();
        }
    };

    // --- BAGONG LOGIC PARA SA PAGBURA NG HISTORY AT AUTO-REVERT NG STOCK ---
    window.deleteHistory = function(storeIdx, histIdx) {
        const historyItem = consignments[storeIdx].history[histIdx];
        
        if (confirm('Sigurado ka bang burahin ang linyang ito sa kasaysayan? Awtomatikong aayusin nito ang stock.')) {
            // Revert o ibalik ang epekto sa stock depende sa uri ng log
            if (historyItem.type === 'checkup') {
                // Kung checkup/nabenta ang binura, ibabalik ang stock sa currentStock
                consignments[storeIdx].currentStock += historyItem.qty;
            } else if (historyItem.type === 'reject') {
                // Kung rejected ang binura, ibabalik ang stock at ibabawas sa rejected count
                consignments[storeIdx].currentStock += historyItem.qty;
                consignments[storeIdx].rejectedQty -= historyItem.qty;
                if (consignments[storeIdx].rejectedQty < 0) consignments[storeIdx].rejectedQty = 0;
            } else if (historyItem.type === 'restock') {
                // Kung restock ang binura, ibabawas sa initialQty at currentQty
                consignments[storeIdx].initialQty -= historyItem.qty;
                consignments[storeIdx].currentStock -= historyItem.qty;
            } else if (historyItem.type === 'start') {
                alert('Hindi maaaring burahin ang unang simula ng consignment log. I-delete na lang ang buong tindahan kung kinakailangan.');
                return;
            }

            // Alisin na sa array ng history
            consignments[storeIdx].history.splice(histIdx, 1);
            saveAndRender();
        }
    };

    window.deleteStore = function(index) {
        if (confirm('Sigurado ka bang burahin ang tindahang ito?')) {
            consignments.splice(index, 1);
            saveAndRender();
        }
    };

    window.printStore = function(index) {
        window.print();
    };

    // Export/Import lumang data file
    document.getElementById('exportBtn').addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(consignments));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "consignment_detailed_data.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    });

    const importFile = document.getElementById('importFile');
    document.getElementById('importBtn').addEventListener('click', () => importFile.click());

    importFile.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const parsed = JSON.parse(evt.target.result);
                if (Array.isArray(parsed)) {
                    consignments = parsed;
                    saveAndRender();
                    alert('Matagumpay na na-load ang lumang data file!');
                } else {
                    alert('Maling format ng file.');
                }
            } catch (err) {
                alert('Hindi mabasa ang JSON file.');
            }
        };
        reader.readAsText(file);
    });

    // PWA Install prompt handler
    let deferredPrompt;
    const installCard = document.getElementById('installCard');
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installCard.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') {
                installCard.style.display = 'none';
            }
            deferredPrompt = null;
        }
    });

    renderApp();
</script>
