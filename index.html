<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasunduan sa Consignment - Doctor's Whisk Broom</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background: #f9f9f9; }
        .agreement-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #2e7d32; font-size: 1.5rem; margin-bottom: 5px; }
        h2 { color: #333; font-size: 1.1rem; margin-bottom: 20px; border-bottom: 2px solid #4caf50; padding-bottom: 5px; }
        .qr-section { margin-top: 30px; padding: 15px; background: #e8f5e9; border-radius: 6px; border: 1px dashed #4caf50; display: inline-block; }
        .qr-section img { width: 150px; height: 150px; margin-top: 10px; border: 2px solid #2e7d32; border-radius: 4px; background: white; padding: 5px; }
        .no-print { text-align: center; margin-top: 20px; }
        button { background-color: #2e7d32; color: white; border: none; padding: 10px 20px; font-size: 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1b5e20; }
        @media print {
            body { background: white; padding: 0; }
            .agreement-card { box-shadow: none; padding: 0; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>

    <div class="agreement-card">
        <h1>🧹 DOCTOR'S WHISK BROOM</h1>
        <h2>KASUNDUAN SA CONSIGNMENT</h2>
        
        <p style="margin-bottom: 20px; font-size: 0.95rem;">I-scan ang QR code sa ibaba para sa direktang pag-access sa iyong store portal, imbentaryo, at restock request.</p>

        <div class="qr-section">
            <strong>QR Code ng Tindahan</strong><br>
            <img src="QR.png" alt="QR Code ng Portal">
            <p style="font-size: 0.8rem; color: #555; margin-top: 8px;">Doctor's Whisk Broom Client Portal</p>
        </div>
    </div>

    <div class="no-print">
        <button onclick="window.print()">🖨️ I-print ang Kasunduang Ito</button>
    </div>

</body>
</html>
