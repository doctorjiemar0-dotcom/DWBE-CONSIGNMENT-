<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Whisk Broom - Client Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2e7d32">
    <style>
        :root { --primary-color: #2e7d32; --secondary-color: #4caf50; --background-color: #f4f6f8; --text-color: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background-color); color: var(--text-color); padding-bottom: 50px; }
        header { background-color: var(--primary-color); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0px 2px 4px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { font-size: 1rem; margin-bottom: 10px; color: var(--primary-color); }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .summary-row-highlight { border-top: 1px dashed #a5d6a7; padding-top: 8px; font-weight: bold; color: var(--primary-color); }
        #syncStatus { text-align: center; font-size: 0.8rem; color: #666; margin-bottom: 10px; font-style: italic; }
        .history-item { border-bottom: 1px solid #eee; padding-bottom: 5px; margin-bottom: 5px; font-size: 0.85rem; color: #555; }
    </style>
</head>
<body>

    <header>🧹 Doctor's Whisk Broom - Client</header>

    <div class="container">
        <div id="syncStatus">Kumokonekta sa Cloud Database...</div>

        <div class="card" id="clientCard">
            <h2 id="storeTitle">🏪 Tindahan</h2>
            <div class="summary-box" style="background: #e8f5e9; padding: 12px; border-radius: 8px; border: 1px solid #c8e6c9; margin-top: 10px;">
                <div class="summary-row"><span>Uri ng Estilo:</span><span id="styleType">-</span></div>
                <div class="summary-row"><span>Presyo bawat Isa:</span><span id="price">-</span></div>
                <div class="summary-row"><span>Simulang Stock:</span><span id="initialQty">-</span></div>
                <div class="summary-row"><span>Natitirang Stock:</span><span id="currentStock" style="color: #2e7d32; font-weight: bold;">-</span></div>
                <div class="summary-row"><span>Kabuuang Nabenta:</span><span id="soldQty" style="color: #c2185b; font-weight: bold;">-</span></div>
                <div class="summary-row summary-row-highlight"><span>Kabuuang Benta:</span><span id="totalSales">₱0</span></div>
            </div>
        </div>

        <div class="card">
            <h2>📜 Kasaysayan ng Transaksyon</h2>
            <div id="historyList">
                <p style="font-size: 0.85rem; color: #666;">Wala pang tala.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDMFmZfC84e3pFQM8pHociQ0JwUL8ek_us",
          authDomain: "dwbe-consignment.firebaseapp.com",
          projectId: "dwbe-consignment",
          storageBucket: "dwbe-consignment.firebasestorage.app",
          messagingSenderId: "205759197252",
          appId: "1:205759197252:web:b04400821f81791d10cc11"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const syncStatus = document.getElementById('syncStatus');
        
        // Kunin ang pangalan ng tindahan mula sa URL (Hal. index.html?store=Aling%20Nena)
        const urlParams = new URLSearchParams(window.location.search);
        const storeName = urlParams.get('store');

        if (!storeName) {
            document.getElementById('storeTitle').textContent = "⚠️ Walang Napiling Tindahan";
            syncStatus.textContent = "Pakitukoy ang tindahan gamit ang tamang link mula sa Admin Panel.";
        } else {
            document.getElementById('storeTitle').textContent = `🏪 ${storeName}`;
            loadClientData(storeName);
        }

        async function loadClientData(targetStore) {
            syncStatus.textContent = "Kumukuha ng data sa Cloud...";
            try {
                const docRef = doc(db, "app_data", "main_inventory");
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const consignments = data.consignments || [];
                    
                    // Hanapin ang partikular na tindahan sa listahan
                    const storeData = consignments.find(item => item.storeName === targetStore);

                    if (storeData) {
                        renderClient(storeData);
                        syncStatus.textContent = "✅ Nakakonekta sa Cloud Database";
                    } else {
                        syncStatus.textContent = "⚠️ Hindi natagpuan ang tindahang ito sa database.";
                    }
                } else {
                    syncStatus.textContent = "⚠️ Walang makitang record sa database.";
                }
            } catch (err) {
                console.error("Error loading client data:", err);
                syncStatus.textContent = "⚠️ Nabigo sa pagkonekta sa Cloud.";
            }
        }

        function renderClient(item) {
            if (item.rejectedQty === undefined) item.rejectedQty = 0;
            const sold = Math.max(0, item.initialQty - item.currentStock - item.rejectedQty);
            const sales = sold * item.price;

            document.getElementById('styleType').textContent = item.styleType || 'Ordinary';
            document.getElementById('price').textContent = '₱' + item.price;
            document.getElementById('initialQty').textContent = item.initialQty + ' pcs';
            document.getElementById('currentStock').textContent = item.currentStock + ' pcs';
            document.getElementById('soldQty').textContent = sold + ' pcs';
            document.getElementById('totalSales').textContent = '₱' + sales.toLocaleString();

            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';

            if (item.history && item.history.length > 0) {
                item.history.forEach(h => {
                    const div = document.createElement('div');
                    div.className = 'history-item';
                    div.innerHTML = `▪️ [${h.date}] ${h.text}`;
                    historyList.appendChild(div);
                });
            } else {
                historyList.innerHTML = '<p style="font-size: 0.85rem; color: #666;">Wala pang tala.</p>';
            }
        }
    </script>
</body>
</html>
