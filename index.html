<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor's Whisk Broom - Client Portal</title>
    <style>
        :root { --primary-color: #2e7d32; --background-color: #f4f6f8; --text-color: #333; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--background-color); color: var(--text-color); padding-bottom: 50px; }
        
        /* Header na may Secret Store Selector */
        header { 
            background-color: var(--primary-color); 
            color: white; 
            padding: 15px; 
            text-align: center; 
            font-size: 1.2rem; 
            font-weight: bold; 
            cursor: pointer; 
            user-select: none;
        }
        
        /* Ang Secret Dropdown Container (Nakatago sa simula) */
        #secretStoreSelectorContainer {
            display: none;
            background: #1b5e20;
            padding: 10px;
            text-align: center;
            border-bottom: 2px solid #388e3c;
        }
        #secretStoreSelectorContainer select {
            padding: 6px;
            font-size: 0.9rem;
            border-radius: 4px;
            border: none;
            width: 80%;
            max-width: 300px;
        }

        .container { padding: 15px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0px 2px 4px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h2 { font-size: 1rem; margin-bottom: 10px; color: var(--primary-color); }
        
        .summary-box { background: #e8f5e9; padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #c8e6c9; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem; }
        
        .form-group { margin-bottom: 10px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 3px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
        button { background-color: #4caf50; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 5px; }
        button:hover { background-color: #388e3c; }

        .chat-box { background: #fafafa; border: 1px solid #ddd; padding: 10px; border-radius: 6px; max-height: 150px; overflow-y: auto; margin-bottom: 10px; font-size: 0.85rem; }
    </style>
</head>
<body>

    <!-- SECRET HEADER: I-click nang 3 beses sunod-sunod ang "Doctor's Whisk Broom" para lumabas ang selector -->
    <header id="secretHeader" onclick="handleSecretClick()">
        🧹 Doctor's Whisk Broom
    </header>

    <!-- NAKATAGONG STORE SELECTOR DROPDOWN -->
    <div id="secretStoreSelectorContainer">
        <select id="clientStoreSelect" onchange="switchClientStore()">
            <option value="">-- Pumili ng Tindahan (Admin View) --</option>
            <!-- Dito papasok ang listahan ng mga tindahan mula sa database/localStorage -->
        </select>
    </div>

    <div class="container">
        <div id="portalContent">
            <div class="card">
                <h2>Impormasyon ng Tindahan</h2>
                <div class="summary-box">
                    <div class="summary-row"><span>Pangalan ng Tindahan:</span><strong id="clientStoreName">-</strong></div>
                    <div class="summary-row"><span>Uri ng Estilo:</span><strong id="clientStyleType">-</strong></div>
                    <div class="summary-row"><span>Presyo bawat Isa:</span><strong id="clientPrice">-</strong></div>
                    <div class="summary-row"><span>Natitirang Stock:</span><strong id="clientCurrentStock">-</strong></div>
                    <div class="summary-row"><span>Kabuuang Nabenta:</span><strong id="clientSold">-</strong></div>
                </div>
            </div>

            <!-- Restock Request Section -->
            <div class="card">
                <h2>Humiling ng Karagdagang Stock (Restock)</h2>
                <div class="form-group">
                    <label for="restockQty">Ilan ang gustong hinging stock?</label>
                    <input type="number" id="restockQty" placeholder="Hal. 10">
                </div>
                <button type="button" onclick="sendRestockRequest()">Ipadala ang Restock Request</button>
            </div>

            <!-- Chat / Paalala Section -->
            <div class="card">
                <h2>Chat / Mensahe sa Admin</h2>
                <div class="chat-box" id="clientChatMessages">
                    <div style="color:#778;">Wala pang mensahe.</div>
                </div>
                <div class="form-group">
                    <input type="text" id="clientChatInput" placeholder="Mag-type ng mensahe...">
                </div>
                <button type="button" onclick="sendClientChat()">Ipadala ang Mensahe</button>
            </div>
        </div>
    </div>

    <script>
        let clickCount = 0;
        let clickTimer = null;

        // Sekreto: Kailangan i-click ng 3 beses nang mabilis ang header para lumabas ang dropdown
        function handleSecretClick() {
            clickCount++;
            if (clickTimer) clearTimeout(clickTimer);
            
            clickTimer = setTimeout(() => {
                clickCount = 0;
            }, 600); // 0.6 seconds window para sa 3 clicks

            if (clickCount >= 3) {
                const selectorContainer = document.getElementById('secretStoreSelectorContainer');
                if (selectorContainer.style.display === 'block') {
                    selectorContainer.style.display = 'none';
                    alert('Nakatago na ulit ang store selector.');
                } else {
                    selectorContainer.style.display = 'block';
                    loadStoresIntoDropdown();
                    alert('Na-activate ang Secret Store Selector!');
                }
                clickCount = 0;
            }
        }

        // Mag-load ng mga tindahan mula sa LocalStorage o Cloud Data
        function loadStoresIntoDropdown() {
            const select = document.getElementById('clientStoreSelect');
            select.innerHTML = '<option value="">-- Pumili ng Tindahan --</option>';
            
            const rawData = localStorage.getItem('consignments_v3');
            if (rawData) {
                try {
                    const data = JSON.parse(rawData);
                    if (data.consignments && data.consignments.length > 0) {
                        data.consignments.forEach((store, index) => {
                            const opt = document.createElement('option');
                            opt.value = index;
                            opt.textContent = `${store.storeName} (${store.styleType})`;
                            select.appendChild(opt);
                        });
                    }
                } catch (e) {
                    console.error("Error loading stores", e);
                }
            }
        }

        // Kapag pumili ng ibang tindahan sa secret dropdown
        function switchClientStore() {
            const index = document.getElementById('clientStoreSelect').value;
            if (index === "") return;

            const rawData = localStorage.getItem('consignments_v3');
            if (rawData) {
                const data = JSON.parse(rawData);
                const store = data.consignments[index];
                
                // I-display ang data ng napiling tindahan
                document.getElementById('clientStoreName').textContent = store.storeName;
                document.getElementById('clientStyleType').textContent = store.styleType;
                document.getElementById('clientPrice').textContent = '₱' + store.price;
                document.getElementById('clientCurrentStock').textContent = store.currentStock + ' pcs';
                const sold = Math.max(0, store.initialQty - store.currentStock - (store.rejectedQty || 0));
                document.getElementById('clientSold').textContent = sold + ' pcs';

                // I-load ang chat messages ng tindahang ito
                const chatContainer = document.getElementById('clientChatMessages');
                if (store.messages && store.messages.length > 0) {
                    let html = '';
                    store.messages.forEach(m => {
                        html += `<div style="margin-bottom: 4px;"><strong>[${m.date}]</strong> ${m.text}</div>`;
                    });
                    chatContainer.innerHTML = html;
                } else {
                    chatContainer.innerHTML = '<div style="color:#778;">Wala pang mensahe.</div>';
                }
            }
        }

        function sendRestockRequest() {
            alert('Naipadala na ang restock request sa admin!');
        }

        function sendClientChat() {
            alert('Naipadala na ang mensahe!');
        }
    </script>
</body>
</html>
